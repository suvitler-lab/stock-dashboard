name = "stock-dashboard"
main = "worker.js"
compatibility_date = "2024-11-01"

# Worker + Static Assets — เสิร์ฟไฟล์ใน ./public ผ่าน binding ASSETS
# Worker รันเฉพาะ route ที่ไม่ใช่ไฟล์ static (เช่น /api/ics = proxy ปฏิทิน iCal)
[assets]
directory = "./public"
binding = "ASSETS"

# Server-stored watchlist (cross-device) — เก็บที่นี่เพื่อให้คอม/iPad/มือถือเห็นข้อมูลเดียวกันโดยไม่ต้องตั้งรหัสซิงค์
[[kv_namespaces]]
binding = "WATCHLIST"
id = "3e57c54fcbda4858a4a861a378a7ce0d"

# D1 - Decision Journal (Phase 0.5) เก็บ snapshot ราคา+อินดิเคเตอร์รายวัน ไว้วัดผลย้อนหลัง
[[d1_databases]]
binding = "JOURNAL"
database_name = "stock-journal"
database_id = "507e1012-d2f9-43d7-882c-24b2515268dc"

# Cron - (1) คำนวณ signal เขียนลง KV ทุก 15 นาที (single source)
#        (2) snapshot ลง D1 ทุกวัน 22:00 UTC = 05:00 น.ไทย (หลังตลาด US ปิด) + heartbeat
#        (3) backup journal เป็น CSV เข้า Telegram ทุกเสาร์ 23:00 UTC = 06:00 น.อาทิตย์ไทย
[triggers]
crons = ["*/15 * * * *", "0 22 * * 1-5", "0 23 * * 6"]



