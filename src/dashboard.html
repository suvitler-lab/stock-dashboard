<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Dashboard · Aria</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>📈</text></svg>">
<script>try{var _t=JSON.parse(localStorage.getItem('stk.theme'));if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0a0c12; --bg-1:#0e1119;
    --panel:#13161f; --panel2:#191d28; --line:#262b38; --line2:#2f3546;
    --txt:#e7eaf0; --muted:#9aa3b2; --dim:#646b7a;
    --brand:#3b82f6; --brand2:#60a5fa; --violet:#8b5cf6;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --up:#4ade80; --down:#f87171;
    --chartbg:#0d1017; --track:#3a4150;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px -20px rgba(0,0,0,.8);
    --shadow-lg:0 28px 70px -34px rgba(0,0,0,.85);
    --glass:rgba(15,18,26,.72);
    --radius:16px;
  }
  html[data-theme="light"]{
    --bg:#eaeef6; --bg-1:#f3f6fb;
    --panel:#ffffff; --panel2:#f2f5fa; --line:#e3e8f1; --line2:#d5dce8;
    --txt:#1b2233; --muted:#5a6678; --dim:#9aa4b5;
    --up:#15a34a; --down:#dc2626;
    --chartbg:#f7f9fc; --track:#cbd3e0;
    --shadow:0 1px 2px rgba(30,41,73,.05),0 14px 30px -22px rgba(30,41,73,.32);
    --shadow-lg:0 28px 64px -34px rgba(30,41,73,.4);
    --glass:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(1200px 600px at 82% -12%,var(--bg-1),transparent 60%),
               radial-gradient(900px 520px at -5% 0%,rgba(59,130,246,.06),transparent 55%),var(--bg);
    transition:background .3s,color .3s}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  .head-font{font-family:'Prompt','Sarabun',sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  a{color:var(--brand2)}
  ::selection{background:rgba(59,130,246,.3)}

  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 80px}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    margin:0 -28px 24px;padding:16px 28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--violet));display:grid;place-items:center;font-size:23px;box-shadow:0 8px 22px -8px rgba(59,130,246,.6)}
  .brand h1{font-size:19px;letter-spacing:.2px}
  .brand p{font-size:11.5px;color:var(--muted);letter-spacing:1px}
  .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .status{font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18),0 0 8px var(--green)}
  .dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
  .dot.idle{background:var(--dim)}

  .btn{background:var(--brand);color:#fff;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 6px 16px -10px rgba(59,130,246,.9)}
  .btn:hover{background:var(--brand2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--brand);background:var(--panel)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.danger{background:#2a1416;color:#fca5a5;border:1px solid #3a1d22;box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  html[data-theme="light"] .btn.danger{background:#fde8e8;color:#dc2626;border-color:#f7caca}
  html[data-theme="light"] .btn.ghost{box-shadow:var(--shadow)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:15px;margin-bottom:24px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--violet));opacity:.85}
  .kpi .lab{font-size:12.5px;color:var(--muted)}
  .kpi .val{font-size:27px;font-weight:700;margin-top:9px;line-height:1}
  .kpi .meta{font-size:12px;margin-top:7px;color:var(--dim)}

  .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
  .section .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .section h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer;transition:background .12s}
  tbody tr.click:hover{background:var(--panel2)}
  .num{text-align:right}
  .up{color:var(--up)} .down{color:var(--down)}
  .ah{font-size:10px;font-weight:600;margin-top:2px;opacity:.85;letter-spacing:.2px}

  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.4px;white-space:nowrap}
  .pill.buy{background:#0f2a1a;color:#4ade80} .pill.sell{background:#2a1416;color:#f87171}
  .pill.hold{background:#27211040;color:#fcd34d;border:1px solid #3a2f15} .pill.na{background:#23262f;color:var(--dim)}
  .pill.new{background:rgba(96,165,250,.13);color:#7cb5ff;border:1px solid rgba(96,165,250,.30)}
  html[data-theme="light"] .pill.buy{background:#dcfce7;color:#15803d}
  html[data-theme="light"] .pill.sell{background:#fee2e2;color:#b91c1c}
  html[data-theme="light"] .pill.hold{background:#fef9c3;color:#a16207;border-color:#fde68a}
  html[data-theme="light"] .pill.na{background:#eef1f6;color:#94a0b2}
  html[data-theme="light"] .pill.new{background:#dbeafe;color:#2563eb;border-color:#bfdbfe}
  .sym{font-weight:700;font-family:'Prompt'} .symx{font-size:11px;color:var(--dim)}
  .rsi-b{display:inline-block;min-width:34px;text-align:center;padding:2px 0;border-radius:6px;font-size:12.5px;font-weight:700}
  /* หุ้นใหม่ / ข้อมูลย้อนหลังไม่พอ — โชว์ให้รู้ว่า "ระบบไม่พัง แค่หุ้นยังใหม่" */
  .spark-na{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-weight:600;white-space:nowrap}
  .spark-na::before{content:"";display:inline-block;width:30px;border-top:1.6px dashed currentColor;opacity:.55}
  tr.row-new td{background:rgba(96,165,250,.045)}
  tr.row-new td:first-child{box-shadow:inset 3px 0 0 rgba(96,165,250,.5)}
  tr.row-new .sym{opacity:.92}

  /* ---------- Command Center ---------- */
  .cc{margin-bottom:24px}
  .cc-top{display:grid;grid-template-columns:1fr minmax(220px,.62fr);gap:14px;margin-bottom:14px}
  .cc-regime{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}
  .cc-rgoff{margin-top:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#f87171;font-weight:600;line-height:1.5}
  .cc-rg-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cc-rg-m{margin-top:9px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .cc-sep{color:var(--dim)} .cc-dim{color:var(--dim);font-size:12.5px;font-weight:400}
  .cc-heat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow)}
  .cc-heat.warn{border-color:#f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.07),transparent)}
  .cc-heat-h{font-size:12.5px;color:var(--muted);font-weight:600}
  .cc-heat-v{font-size:15px;margin-top:5px} .cc-heat-v b{font-size:19px}
  .cc-heat-w{font-size:12px;color:#f59e0b;margin-top:6px;line-height:1.45}
  .cc-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px}
  .cc-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .cc-box-h{font-size:13.5px;font-weight:700;margin-bottom:10px}
  .cc-item{padding:7px 0;border-bottom:1px solid var(--line)}
  .cc-item:last-child{border-bottom:none}
  .cc-it-t{display:flex;align-items:center;gap:7px;font-size:14px;flex-wrap:wrap}
  .cc-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .cc-conv{font-size:11px;color:var(--brand2);background:rgba(59,130,246,.12);padding:1px 7px;border-radius:6px;font-weight:600}
  .cc-tag{font-size:10.5px;color:#f59e0b;background:rgba(245,158,11,.12);padding:1px 7px;border-radius:6px;font-weight:700}
  .cc-empty{font-size:12.5px;color:var(--dim);padding:8px 0}
  .cc-links{display:flex;gap:10px;flex-wrap:wrap}
  .cc-link{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;transition:.15s}
  .cc-link:hover{border-color:var(--brand);background:var(--panel);transform:translateY(-1px)}
  @media(max-width:680px){.cc-top{grid-template-columns:1fr}}
  .pos-inv{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
  .pos-inv.breach{background:rgba(239,68,68,.14);color:#f87171}
  .pos-inv.near{background:rgba(245,158,11,.14);color:#f59e0b}
  tr.pos-breach td{background:rgba(239,68,68,.06)} tr.pos-breach td:first-child{box-shadow:inset 3px 0 0 #ef4444}
  tr.pos-near td{background:rgba(245,158,11,.05)} tr.pos-near td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
  tr.pos-tot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:700;font-size:13px;padding-top:12px}
  .cc-item.click{cursor:pointer;transition:background .12s} .cc-item.click:hover{background:var(--panel2)}
  .cc-upd{font-size:11.5px;color:var(--dim);align-self:center;animation:ccpulse 1.2s ease-in-out infinite}
  @keyframes ccpulse{0%,100%{opacity:.4}50%{opacity:1}}
  .alloc-tgt{font-size:10.5px;color:var(--dim)} .alloc-over{color:#f59e0b} .alloc-under{color:#60a5fa}
  /* Edge strip — ระบบนี้แม่นจริงไหม */
  .cc-edge{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .cc-edge-h{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cc-edge-h .cc-dim{font-weight:400}
  .cc-edge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
  .cc-edge-it{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .cc-edge-it .l{font-size:11px;color:var(--muted);line-height:1.4}
  .cc-edge-it .v{font-size:21px;font-weight:700;margin-top:5px;line-height:1}
  .cc-edge-it .s{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.4}
  .cc-edge-empty{font-size:12.5px;color:var(--dim);padding:4px 0;line-height:1.5}

  .wl-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
  .seg button{padding:6px 13px;font-size:12.5px;color:var(--muted);font-weight:600;transition:.12s}
  .seg button.on{background:var(--brand);color:#fff}
  .seg button:not(.on):hover{color:var(--txt);background:var(--panel)}
  /* การ์ด watchlist — เห็นข้อมูลครบบนจอแคบ ไม่โดน hide-sm ตัด */
  .wl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
  .wl-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:.14s}
  .wl-card.click{cursor:pointer}
  .wl-card.click:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .wl-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .wl-card-px{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wl-card-px .ah{margin-top:0}
  .wl-card-spark{margin:10px 0 9px;min-height:46px;display:flex;align-items:center}
  .wl-card-foot{display:flex;align-items:center;gap:9px;padding-top:9px;border-top:1px solid var(--line)}
  .wl-card.row-new{background:rgba(96,165,250,.06)}
  .wl-card.row-new:not(:hover){border-color:rgba(96,165,250,.3)}
  .sel{width:auto;padding:7px 11px;font-size:12.5px}
  .wl-count{font-size:12px;color:var(--dim);margin-left:auto}
  .alloc{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:46px}
  .alloc>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--violet))}

  .add-row{display:flex;gap:9px}
  .inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:14px;width:100%;transition:border-color .15s,background .15s}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

  .overlay{position:fixed;inset:0;background:rgba(4,6,11,.66);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .modal h3{font-size:19px;margin-bottom:3px}
  .modal .msub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  /* master-detail: พาเนลรายละเอียด docked ขวา (เฉพาะจอกว้าง ≥1080px) — ลิสต์ซ้ายยังคลิกได้ */
  .dock-wrap{display:contents}
  .dock{position:fixed;top:0;right:0;height:100vh;width:480px;z-index:90;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-14px 0 44px rgba(0,0,0,.42);overflow-y:auto;
    padding:22px;animation:dockin .2s ease}
  @keyframes dockin{from{transform:translateX(26px);opacity:.5}to{transform:none;opacity:1}}
  .wrap.dock-open{max-width:none;margin:0;padding-right:500px}
  tr.sel td{background:rgba(59,130,246,.1)} tr.sel td:first-child{box-shadow:inset 3px 0 0 #3b82f6}
  .wl-card.sel{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}

  .banner{background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(139,92,246,.08));border:1px solid #2c3550;border-radius:var(--radius);padding:22px;margin-bottom:22px}
  .banner h3{font-size:17px;margin-bottom:10px}
  .banner ol{margin:10px 0 0 18px;font-size:13.5px;line-height:1.9;color:var(--muted)}
  .banner code{background:var(--chartbg);border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-family:'JetBrains Mono';font-size:12.5px}
  .empty{text-align:center;padding:40px;color:var(--dim)}
  .ind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
  .ind{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .ind .l{font-size:11.5px;color:var(--muted)} .ind .v{font-size:18px;font-weight:700;margin-top:3px}
  .reason{font-size:13px;color:var(--muted);line-height:1.7;margin-top:4px}
  .reason li{margin-left:18px}
  @media(max-width:720px){
    .hide-sm{display:none}
    .wrap{padding:0 14px 70px}
    .topbar{margin:0 -14px 18px;padding:13px 14px}
    .brand .mark{width:40px;height:40px;font-size:21px}
    .brand h1{font-size:17px}
    .kpi .val{font-size:23px}
    .modal{padding:18px}
    .row3{grid-template-columns:1fr}
    .wl-count{margin-left:0}
  }
</style>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* ---------- storage ---------- */
const LS="stk.";
function useLS(key,initial){
  const [v,setV]=useState(()=>{try{const r=localStorage.getItem(LS+key);return r!=null?JSON.parse(r):initial;}catch(e){return initial;}});
  useEffect(()=>{try{localStorage.setItem(LS+key,JSON.stringify(v));}catch(e){}},[key,v]);
  return [v,setV];
}
/* ---------- server-stored state (KV ของ CF Worker) — sync ข้ามเครื่องอัตโนมัติ ---------- */
// localStorage = cache โหลดทันที, server = source of truth (โหลดทับ cache หลัง hydrate)
// debounced POST 1.2 วิเมื่อ v เปลี่ยน · ดึงใหม่จาก server ตอน focus tab (จับ edits จากเครื่องอื่น)
// ใช้ lastWriteRef กัน focus-refresh ทับการแก้ในเครื่องที่ POST ยังไม่ไป (race condition)
function useServerLS(key, initial, endpoint){
  const [v,setV] = useLS(key, initial);
  const [hydrated,setHydrated] = useState(false);
  const lastWriteRef = useRef(0);
  useEffect(()=>{
    let cancelled=false;
    (async ()=>{
      try{
        const res = await fetch(endpoint, {cache:"no-store"});
        const srv = res.ok ? await res.json() : null;
        if(cancelled) return;
        if(srv !== null) setV(srv);  // null = KV ว่าง (ใช้ค่า localStorage/initial); ค่าอื่น = ทับ cache
        setHydrated(true);
      }catch(e){ if(!cancelled) setHydrated(true); }
    })();
    return ()=>{ cancelled=true; };
  },[endpoint]);
  useEffect(()=>{
    if(!hydrated) return;
    lastWriteRef.current = Date.now();
    const t = setTimeout(()=>{
      fetch(endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(v)}).catch(()=>{});
    }, 1200);
    return ()=>clearTimeout(t);
  },[hydrated,v,endpoint]);
  useEffect(()=>{
    if(!hydrated) return;
    const onFocus = async ()=>{
      // กัน race: ถ้าเพิ่งแก้ในเครื่องนี้ (POST ยังไม่ propagate) อย่าทับด้วย stale data จาก server
      if(Date.now() - lastWriteRef.current < 3500) return;
      try{
        const res = await fetch(endpoint, {cache:"no-store"});
        if(!res.ok) return;
        const srv = await res.json();
        if(srv !== null && JSON.stringify(srv) !== JSON.stringify(v)) setV(srv);
      }catch(e){}
    };
    window.addEventListener("focus", onFocus);
    const onVis = ()=>{ if(!document.hidden) onFocus(); };
    document.addEventListener("visibilitychange", onVis);
    return ()=>{
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVis);
    };
  },[hydrated,v,endpoint]);
  return [v,setV];
}

/* ---------- indicators (computed client-side from close array) ---------- */
function ema(arr,p){ if(!arr||arr.length<p) return null; const k=2/(p+1); let e=arr.slice(0,p).reduce((a,b)=>a+b,0)/p; for(let i=p;i<arr.length;i++) e=arr[i]*k+e*(1-k); return e; }
function emaSeries(arr,p){ if(!arr||arr.length<p) return []; const k=2/(p+1); let e=arr.slice(0,p).reduce((a,b)=>a+b,0)/p; const out=[e]; for(let i=p;i<arr.length;i++){e=arr[i]*k+e*(1-k);out.push(e);} return out; }
// EMA แบบเต็มความยาว (null ช่วงต้นที่ข้อมูลยังไม่พอ) — ไว้วาดเส้นบนกราฟให้ตรงแกน X กับราคา
function emaFull(arr,p){ if(!arr||arr.length<p) return (arr||[]).map(()=>null); const k=2/(p+1); const out=new Array(arr.length).fill(null); let e=arr.slice(0,p).reduce((a,b)=>a+b,0)/p; out[p-1]=e; for(let i=p;i<arr.length;i++){e=arr[i]*k+e*(1-k);out[i]=e;} return out; }
function sma(arr,p){ if(!arr||arr.length<p) return null; const s=arr.slice(-p); return s.reduce((a,b)=>a+b,0)/p; }
function rsi(arr,p=14){
  // Wilder's RSI (RMA smoothing) — ตรงกับ TradingView/standard
  if(!arr||arr.length<p+1) return null;
  let g=0,l=0;
  for(let i=1;i<=p;i++){ const d=arr[i]-arr[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/p, al=l/p;
  for(let i=p+1;i<arr.length;i++){
    const d=arr[i]-arr[i-1];
    const up=d>0?d:0, dn=d<0?-d:0;
    ag=(ag*(p-1)+up)/p;
    al=(al*(p-1)+dn)/p;
  }
  if(al===0) return 100;
  return 100-100/(1+ag/al);
}
function macd(arr){
  if(!arr||arr.length<35) return null;
  const e12=emaSeries(arr,12), e26=emaSeries(arr,26);
  const off=e12.length-e26.length;
  const line=e26.map((v,i)=>e12[i+off]-v);
  const sig=emaSeries(line,9);
  const m=line[line.length-1], s=sig[sig.length-1];
  return {line:m, signal:s, hist:m-s};
}
function stdev(arr,p){ if(!arr||arr.length<p) return null; const s=arr.slice(-p); const m=s.reduce((a,b)=>a+b,0)/p; const v=s.reduce((a,b)=>a+(b-m)*(b-m),0)/p; return Math.sqrt(v); }
function bollinger(arr,p=20,mult=2){ const mid=sma(arr,p), sd=stdev(arr,p); if(mid==null||sd==null) return null; const upper=mid+mult*sd, lower=mid-mult*sd; const price=arr[arr.length-1]; const pctB=(upper-lower)?(price-lower)/(upper-lower):0.5; return {mid,upper,lower,sd,pctB}; }
function roc(arr,p=10){ if(!arr||arr.length<p+1) return null; const cur=arr[arr.length-1], prev=arr[arr.length-1-p]; if(!prev) return null; return (cur-prev)/prev*100; }
// CMF (Chaikin Money Flow) — เงินสถาบันไหลเข้า/ออก จาก ohlc [{h,l,c}] + volume (ตรงกับ worker เป๊ะ)
function cmf(ohlc,volumes,period=20){
  if(!ohlc||!volumes||ohlc.length<period) return null;
  let mfvSum=0, volSum=0;
  for(let i=ohlc.length-period;i<ohlc.length;i++){
    const b=ohlc[i], v=volumes[i];
    if(b==null||v==null||v<=0) continue;
    const range=b.h-b.l;
    if(range<=0) continue;
    const mfm=((b.c-b.l)-(b.h-b.c))/range;
    mfvSum+=mfm*v; volSum+=v;
  }
  return volSum>0? mfvSum/volSum : null;
}
function computeIndicators(closes,ohlc,volumes){
  if(!closes||closes.length<15) return null;
  const price=closes[closes.length-1];
  const m=macd(closes);
  return {
    rsi: rsi(closes,14),
    ema15: ema(closes,15),
    ema20: ema(closes,20),
    ema30: ema(closes,30),
    ema50: ema(closes,50),
    ema100: ema(closes,100),
    ema200: ema(closes,200),
    sma200: sma(closes,200),
    macd: m,
    boll: bollinger(closes,20,2),
    roc: roc(closes,10),
    cmf: cmf(ohlc,volumes,20),
    price
  };
}
function signalOf(ind){
  if(!ind) return {label:"—",cls:"na",reasons:[]};
  let score=0; const reasons=[];
  const {rsi:r,ema20:e20,ema50:e50,ema100:e100,ema200:e200,sma200:s200,macd:m,boll:bb,roc:rc,price}=ind;
  if(r!=null){ if(r<35){score+=2;reasons.push("RSI "+r.toFixed(0)+" — oversold (น่าสนใจฝั่งซื้อ)");} else if(r>70){score-=2;reasons.push("RSI "+r.toFixed(0)+" — overbought (ระวังย่อ)");} else reasons.push("RSI "+r.toFixed(0)+" — เป็นกลาง"); }
  if(e50!=null){ if(price>e50){score+=1;reasons.push("ราคา > EMA50 → โมเมนตัมขาขึ้น");} else {score-=1;reasons.push("ราคา < EMA50 → โมเมนตัมขาลง");} }
  if(e100!=null){ if(price>e100){score+=1;reasons.push("ราคา > EMA100 → เทรนด์กลางเป็นบวก");} else {score-=1;reasons.push("ราคา < EMA100 → เทรนด์กลางเป็นลบ");} }
  if(s200!=null){ if(price>s200){score+=1;reasons.push("ราคา > SMA200 → เทรนด์ใหญ่ขาขึ้น");} else {score-=1;reasons.push("ราคา < SMA200 → เทรนด์ใหญ่ขาลง");} }
  if(m){ if(m.hist>0){score+=1;reasons.push("MACD histogram บวก → momentum ดีขึ้น");} else {score-=1;reasons.push("MACD histogram ลบ → momentum อ่อน");} }
  // EMA20 vs EMA50 — สัญญาณตัดระยะสั้น
  if(e20!=null && e50!=null){ if(e20>e50){score+=1;reasons.push("EMA20 > EMA50 → แนวโน้มสั้นเป็นบวก");} else {score-=1;reasons.push("EMA20 < EMA50 → แนวโน้มสั้นเป็นลบ");} }
  // EMA50 vs EMA200 — Golden Cross / Death Cross (สัญญาณเทรนด์ใหญ่)
  if(e50!=null && e200!=null){ if(e50>e200){score+=1;reasons.push("EMA50 > EMA200 → Golden Cross (เทรนด์ใหญ่บวก)");} else {score-=1;reasons.push("EMA50 < EMA200 → Death Cross (เทรนด์ใหญ่ลบ)");} }
  // Bollinger Bands — ราคาแตะขอบล่าง/บน
  if(bb){
    if(price<=bb.lower){score+=1;reasons.push("ราคาแตะ Bollinger ขอบล่าง → มีโอกาสเด้ง");}
    else if(price>=bb.upper){score-=1;reasons.push("ราคาแตะ Bollinger ขอบบน → ตึงตัว/ระวังย่อ");}
    else reasons.push("ราคาอยู่ในกรอบ Bollinger ("+(bb.pctB*100).toFixed(0)+"%B)");
  }
  // ROC 10 วัน — โมเมนตัมรวม
  if(rc!=null){ if(rc>0){score+=1;reasons.push("ROC 10 วัน +"+rc.toFixed(1)+"% → โมเมนตัมบวก");} else {score-=1;reasons.push("ROC 10 วัน "+rc.toFixed(1)+"% → โมเมนตัมลบ");} }
  // CMF — เงินสถาบันไหลเข้า/ออก (dead zone ±0.05)
  if(ind.cmf!=null){ if(ind.cmf>0.05){score+=1;reasons.push("CMF "+ind.cmf.toFixed(2)+" → เงินสถาบันไหลเข้า");} else if(ind.cmf<-0.05){score-=1;reasons.push("CMF "+ind.cmf.toFixed(2)+" → เงินสถาบันไหลออก");} else reasons.push("CMF "+ind.cmf.toFixed(2)+" → เงินนิ่ง"); }
  // RS vs S&P500 — หุ้นแข็ง/อ่อนกว่าตลาดวันนี้
  if(ind.rsVsSpx!=null){ if(ind.rsVsSpx>0){score+=1;reasons.push("RS +"+ind.rsVsSpx.toFixed(2)+"% → แข็งกว่าตลาด");} else {score-=1;reasons.push("RS "+ind.rsVsSpx.toFixed(2)+"% → อ่อนกว่าตลาด");} }
  let label="HOLD",cls="hold";
  if(score>=6){label="BUY";cls="buy";} else if(score<=-5){label="SELL";cls="sell";}
  return {label,cls,reasons,score};
}
/* แผนเข้า "3 ไม้" แบบมืออาชีพ — ผูกแต่ละไม้กับเส้น EMA จริง (ตื้น -> ลึก) ไม่ให้ซ้ำกัน */
function suggestPro(ind){
  if(!ind || ind.price==null) return null;
  const p=ind.price;
  // ชั้นแนวรับมาตรฐาน เรียงจากตื้น (ใกล้ราคา) ไปลึก
  const tiers=[
    {n:"EMA15",  v:ind.ema15},
    {n:"EMA30",  v:ind.ema30},
    {n:"EMA50",  v:ind.ema50},
    {n:"EMA100", v:ind.ema100},
    {n:"EMA200", v:ind.ema200},
    {n:"SMA200", v:ind.sma200},
  ];
  // ไม้ 1 = แนวรับใกล้ราคาสุด, ไม้ถัดไปต้อง "ลึกกว่าไม้ก่อนหน้า >= 1.2%" (กันเส้นกระจุก/ซ้ำ)
  const picks=[];
  let lastP=Infinity;
  for(const t of tiers){
    if(t.v==null || t.v>=p*0.999) continue;            // ต้องต่ำกว่าราคาปัจจุบัน
    if(picks.length===0 || t.v < lastP*0.988){
      picks.push({price:+t.v.toFixed(2), label:"แนวรับ "+t.n});
      lastP=t.v;
    }
    if(picks.length>=3) break;
  }
  // เทรนด์แรง/เส้นอยู่เหนือราคา -> เติมไม้ที่ขาดด้วยการย่อเป็น %
  const fbPct=[0.99,0.97,0.95];
  while(picks.length<3){
    let price=+(p*fbPct[picks.length]).toFixed(2);
    if(picks.length && price>=picks[picks.length-1].price*0.992) price=+(picks[picks.length-1].price*0.98).toFixed(2);
    picks.push({price, label:"ย่อตามสัดส่วน"});
  }
  picks.sort((a,b)=>b.price-a.price);                   // เรียงตื้น -> ลึก
  // trend-guard (regime-conditional): ราคาต่ำกว่า EMA200 = เทรนด์ใหญ่ลง → ห้ามถัวลึก (กันรับมีดร่วง)
  // ถัวขาลงเข้าหาแนวรับลึกได้เฉพาะตอน uptrend · ขาลง → เหลือไม้เดียว (ไม้ตื้น) รอเทรนด์กลับก่อน
  const belowTrend = ind.ema200!=null && p < ind.ema200;
  const maxTranches = belowTrend ? 1 : 3;
  const Wmap = {1:[1], 2:[0.5,0.5], 3:[0.3,0.3,0.4]};
  const W = Wmap[maxTranches];                          // ไม้ลึก (ของถูก) ลงน้ำหนักมากสุด เมื่อ uptrend
  const entries=picks.slice(0,maxTranches).map((x,idx)=>({price:x.price, w:W[idx], note:x.label}));
  const avg=entries.reduce((s,e)=>s+e.price*e.w,0);     // ต้นทุนเฉลี่ยถ้าเข้าครบ 3 ไม้
  const e3=entries[entries.length-1].price;
  // Stop Loss = แนวรับใหญ่ถัดไปใต้ไม้ 3 (EMA100/200/SMA200) ห่างอย่างน้อย 3%
  const slBase=[ind.ema100,ind.ema200,ind.sma200].filter(x=>x!=null && x<e3*0.999);
  let sl=slBase.length?Math.max(...slBase):e3*0.96;
  sl=Math.min(sl,e3*0.97);
  const risk=avg-sl;                                    // ความเสี่ยงต่อหุ้น (จากต้นทุนเฉลี่ย)
  const tps=[
    {price:+(avg+risk*1).toFixed(2), w:0.4,  rr:"1:1"},
    {price:+(avg+risk*2).toFixed(2), w:0.35, rr:"1:2"},
    {price:+(avg+risk*3).toFixed(2), w:0.25, rr:"1:3"},
  ];
  const caution = belowTrend ? "ราคาต่ำกว่า EMA200 (เทรนด์ใหญ่ลง) — ลดเหลือ 1 ไม้ ห้ามถัวลึก เสี่ยงรับมีดร่วง" : null;
  return {entries, avg:+avg.toFixed(2), sl:+sl.toFixed(2), risk:+risk.toFixed(2), slPct:+(risk/avg*100).toFixed(2), tps, caution, nTranches:maxTranches};
}
/* แผนแบบ field เดียว (ไว้ซิงค์ไป alert + ปุ่มคำนวณทั้งหมด) — ดึงจากแผน 3 ไม้: ไม้1 = จุดเริ่มเข้า */
function suggestPlan(ind){
  const pro=suggestPro(ind);
  if(!pro) return null;
  return { entry: pro.entries[0].price, sl: pro.sl, tp: pro.tps[1].price };  // เข้าไม้1 / SL ใต้ไม้3 / TP ที่ RR 1:2
}

async function fetchStocks(symbols, webhookUrl){

  const url = webhookUrl + sep + "symbols=" + encodeURIComponent(symbols.join(",")) + "&prepost=1";

  const f=(x,d=2)=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  const buys=(decide.candidates||[]).filter(c=>c.stance==="buy").slice(0,8);
  const posAlerts=((posWatch&&posWatch.positions)||[]).filter(p=>p.alert);
  // %เปลี่ยนวันนี้ จาก worker (/api/decide) → โชว์คู่กับ P/L ในการ์ด position กันสับสน (วันนี้เขียว แต่ P/L เทียบทุนยังแดงได้)
  const dayChg={}; [...(decide.candidates||[]),...(decide.core||[])].forEach(c=>{ if(c&&c.symbol&&c.changePct!=null) dayChg[String(c.symbol).toUpperCase()]=c.changePct; });
  const earn=[...(decide.candidates||[]),...(decide.core||[])]
    .filter(c=>c.earnings&&c.earnings.daysUntil!=null&&c.earnings.daysUntil>=0&&c.earnings.daysUntil<=7)
    .sort((a,b)=>a.earnings.daysUntil-b.earnings.daysUntil);
  const econ=decide.econEvents||[];
  const heatWarn=heat.warn||(heat.correlatedClusters&&heat.correlatedClusters.length)||heat.killSwitch||(heat.themeConcentration&&heat.themeConcentration.length);
  const LINKS=[["🧭","Decision เต็ม","/decide"],["🧠","Thesis (AI)","/thesis"],["📊","Performance","/performance"],["📍","Positions","/positions"],["📒","ประวัติเทรด","/trades"]];
  return (
    <div className="cc">
      <div className="cc-top">
        <div className="cc-regime" style={{borderColor:rgCol}}>
          <div className="cc-rg-h"><span style={{fontSize:22}}>{rgIco}</span><b style={{color:rgCol,fontSize:18}}>{rgLab}</b><span className="cc-dim">· เกณฑ์ BUY ≥ {decide.buyThresh}</span></div>
          <div className="cc-rg-m">
            <span>S&amp;P500 <b className="mono">{f(rg.spxPrice,0)}</b> {rg.aboveEma200Pct!=null&&<span className={rg.aboveEma200Pct>=0?"up":"down"}>{rg.aboveEma200Pct>=0?"▲":"▼"}{f(Math.abs(rg.aboveEma200Pct),1)}%</span>}</span>
            <span className="cc-sep">·</span>
            <span>Nasdaq <b className="mono">{f(rg.ndxPrice,0)}</b> {rg.ndxAboveEma200Pct!=null&&<span className={rg.ndxAboveEma200Pct>=0?"up":"down"}>{rg.ndxAboveEma200Pct>=0?"▲":"▼"}{f(Math.abs(rg.ndxAboveEma200Pct),1)}%</span>}</span>
            <span className="cc-sep">·</span>
            <span>VIX <b className="mono">{f(rg.vix,1)}</b></span>
            {rg.creditOk!=null&&<React.Fragment><span className="cc-sep">·</span><span title="HYG เทียบ EMA50 — นักลงทุนยังกล้าเสี่ยงเครดิตไหม">เครดิต {rg.creditOk?"🟢":"🔴"}</span></React.Fragment>}
            {rg.breadthOk!=null&&<React.Fragment><span className="cc-sep">·</span><span title="RSP/SPX — หุ้นขึ้นเป็นวงกว้าง หรือกระจุกหุ้นใหญ่">breadth {rg.breadthOk?"🟢":"🔴"}</span></React.Fragment>}
          </div>
          {rg.internalsNote&&<div className="cc-rgoff" style={{background:"rgba(245,158,11,.1)",borderColor:"rgba(245,158,11,.3)",color:"#f59e0b"}}>⚠️ ดัชนีขึ้นแต่ภายในอ่อน ({rg.internalsNote}) — ลดจาก risk-on → เป็นกลาง (rally แคบ/เครดิตเครียด ระวัง)</div>}
          {rg.regime==="risk-off"&&<div className="cc-rgoff">⚠️ ตลาดเลี่ยงความเสี่ยง — พิจารณาลด exposure / ถือเงินสดเพิ่ม · ระวังเข้าซื้อใหม่ (เกณฑ์ BUY ยกขึ้นเป็น {decide.buyThresh})</div>}
        </div>
        <div className={"cc-heat"+(heatWarn?" warn":"")}>
          <div className="cc-heat-h">🔥 Portfolio Heat</div>
          <div className="cc-heat-v"><b>{heat.buyCount!=null?heat.buyCount:"—"}</b> สัญญาณซื้อ {heat.grossRiskPct!=null&&<span className="cc-dim">· เสี่ยงรวม {heat.grossRiskPct}% / {heat.maxSafePct}%</span>}</div>
          {heat.killSwitch&&<div className="cc-heat-w" style={{color:"#f87171",fontWeight:700}}>{heat.killSwitch}</div>}
          {heat.warn&&<div className="cc-heat-w">⚠️ {heat.warn}</div>}
          {heat.correlatedClusters&&heat.correlatedClusters.length>0&&<div className="cc-heat-w">🔗 ซ้ำ: {heat.correlatedClusters.join(", ")}</div>}
          {heat.themeConcentration&&heat.themeConcentration.length>0&&<div className="cc-heat-w">🎯 กระจุก theme: {heat.themeConcentration.join(", ")}</div>}
        </div>
      </div>
      {defense&&(()=>{
        const DL={0:"#22c55e",1:"#f59e0b",2:"#fb923c",3:"#ef4444"}[defense.level]||"#646b7a";
        const trim=(defense.trimPlan||[]).filter(p=>!p.keep&&p.sharesToSell>0).slice(0,3);
        return (
          <div style={{margin:"4px 0 10px",border:"1px solid "+DL,borderLeft:"4px solid "+DL,borderRadius:10,padding:"10px 13px",background:"rgba(255,255,255,0.02)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <b style={{color:DL,fontSize:15}}>🛡️ ป้องกันพอร์ต — ระดับ {defense.level} · {defense.levelTag}</b>
              {defense.weightedBeta!=null&&<span className="cc-dim" style={{fontSize:12}}>· weighted β ≈ {defense.weightedBeta}</span>}
              <a className="cc-conv" style={{textDecoration:"none",marginLeft:"auto",fontSize:11}} href="/defense" target="_blank" rel="noopener noreferrer">ดูเต็ม →</a>
            </div>
            {defense.triggers&&defense.triggers.length>0
              ? <div style={{fontSize:12.5,marginTop:5,color:"#fca5a5"}}>🚨 {defense.triggers.join(" · ")}</div>
              : <div style={{fontSize:12.5,marginTop:5,color:"#22c55e"}}>ไม่มี trigger ตลาดเปิด{defense.headroom&&defense.headroom.length?" — "+defense.headroom.join(" · "):""}</div>}
            <div style={{fontSize:12.5,marginTop:5}}>📌 {defense.action}</div>
            {trim.length>0&&<div style={{fontSize:12,marginTop:5,color:"var(--dim)"}}>✂️ trim ก่อน: {trim.map(p=>p.symbol+" −"+p.trimPct+"% (β"+(p.beta!=null?p.beta:"—")+")").join(" · ")} · ได้เงินสด ~${Number(defense.totalFreed||0).toLocaleString()}</div>}
          </div>
        );
      })()}
      <div className="cc-actions">
        <div className="cc-box">
          <div className="cc-box-h" style={{color:"var(--up)"}}>🟢 น่าซื้อ ({buys.length})</div>
          {buys.length===0?<div className="cc-empty">ไม่มีสัญญาณซื้อที่ผ่านเกณฑ์</div>:
            buys.map(c=>(<div key={c.symbol} className="cc-item click" onClick={()=>onPick&&onPick(c.symbol)} title="คลิกดูรายละเอียด/เพิ่มแผน">
              <div className="cc-it-t"><b>{c.symbol}</b> <span className="cc-conv">conv {c.conviction}</span>{c.sizing&&c.sizing.sizeFactor!=null&&<span className="cc-tag" title="ไม้ถูกลด (correlation/kill-switch/event)">×{c.sizing.sizeFactor}</span>}{c.earnings&&c.earnings.daysUntil!=null&&c.earnings.daysUntil<=7&&<span className="cc-tag">งบ {c.earnings.daysUntil}ว</span>}</div>
              <div className="cc-sub">{c.sizing&&c.sizing.shares!=null?(f(c.sizing.shares)+" หุ้น · "+c.sizing.pctOfPort+"% พอร์ต"):("$"+f(c.price))}</div>
              {c.fundFlags&&c.fundFlags.length>0&&<div className="cc-sub" style={{color:"#f59e0b"}}>{c.fundFlags.join(" · ")}</div>}

        </div>
        <div className="cc-box">
          <div className="cc-box-h" style={{color:"var(--down)"}}>📍 Position ต้องดู ({posAlerts.length})</div>
          {posAlerts.length===0?<div className="cc-empty">ทุก position ปกติ</div>:
            posAlerts.map(p=>(<div key={p.symbol} className="cc-item click" onClick={()=>onPick&&onPick(p.symbol)} title="คลิกดูรายละเอียด">
              <div className="cc-it-t"><b>{p.symbol}</b> {dayChg[String(p.symbol).toUpperCase()]!=null&&<span className={dayChg[String(p.symbol).toUpperCase()]>=0?"up":"down"}>วันนี้ {dayChg[String(p.symbol).toUpperCase()]>=0?"+":""}{f(dayChg[String(p.symbol).toUpperCase()])}%</span>} <span className="cc-dim">· P/L <span className={p.plPct>=0?"up":"down"}>{p.plPct>=0?"+":""}{f(p.plPct)}%</span> เทียบทุน</span></div>
              <div className="cc-sub">{p.alert}</div>
            </div>))}
        </div>
        <div className="cc-box">
          <div className="cc-box-h" style={{color:"#f59e0b"}}>📅 เหตุการณ์ใกล้ ({earn.length+econ.length})</div>
          {(earn.length+econ.length)===0?<div className="cc-empty">ไม่มีงบ/Fed ในช่วงนี้</div>:<React.Fragment>
            {econ.map(e=>(<div key={e.date} className="cc-item" style={{borderLeft:"3px solid #a855f7",paddingLeft:8}}>
              <div className="cc-it-t"><b>🏛️ {e.name.split(" —")[0].split(" +")[0]}</b> <span className="cc-tag">อีก {e.daysUntil} ว</span></div>
              <div className="cc-sub">{e.date} — ทั้งตลาดผันผวน · ระวังเปิดไม้ใหญ่</div>
            </div>))}
            {earn.map(c=>(<div key={c.symbol} className="cc-item click" onClick={()=>onPick&&onPick(c.symbol)} title="คลิกดูรายละเอียด">
              <div className="cc-it-t"><b>{c.symbol}</b> <span className="cc-tag">งบอีก {c.earnings.daysUntil} ว</span></div>
              <div className="cc-sub">{c.earnings.date} — เลี่ยงเข้าเต็มไม้ก่อนงบ</div>
            </div>))}
          </React.Fragment>}
        </div>
      </div>
      {scenario&&scenario.scenarios&&(
        <div style={{margin:"10px 0",border:"1px solid var(--line)",borderRadius:10,padding:"10px 13px"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <b style={{fontSize:14}}>🎲 จำลองพอร์ต (Fed scenario)</b>
            <span className="cc-dim" style={{fontSize:12,marginLeft:"auto"}}>Expected ≈ <b style={{color:(scenario.expectedReturnPct||0)>=0?"var(--up)":"var(--down)"}}>{(scenario.expectedReturnPct>=0?"+":"")+scenario.expectedReturnPct}%</b></span>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:7}}>
            {scenario.scenarios.map(s=>{
              const col=(s.portReturnPct||0)>=0?"var(--up)":"var(--down)";
              return <div key={s.key} style={{flex:"1 1 120px",border:"1px solid var(--line)",borderRadius:8,padding:"7px 9px"}}>
                <div style={{fontSize:11,color:"var(--dim)"}}>{s.label}</div>
                <div style={{fontSize:16,fontWeight:700,color:col}}>{((s.portReturnPct||0)>=0?"+":"")+s.portReturnPct}%</div>
                <div style={{fontSize:11,color:"var(--dim)"}}>โอกาส {s.prob}%</div>
              </div>;
            })}
          </div>
          <div style={{fontSize:11,color:"var(--dim)",marginTop:6}}>⚠️ โอกาส%เป็นค่าสมมติตาม regime · ผลอิง beta ประมาณ — ใช้ชี้ทิศทาง/ขนาดเสี่ยงสัมพัทธ์ ไม่ใช่พยากรณ์ราคา</div>
        </div>
      )}
      <AllocCard/>
      {/* Edge — ปิด loop: ระบบนี้แม่นจริงไหม (paper = ชนะ SPX, real = เทรดจริง) */}
      {(()=>{
        const buy10=perf&&perf.horizons&&perf.horizons["10"]&&perf.horizons["10"].BUY;
        const ts=tstats&&tstats.summary;
        const hasPaper=buy10&&buy10.n>0;
        const hasReal=ts&&tstats.count>0;
        return (
          <div className="cc-edge">
            <div className="cc-edge-h">📈 Edge — ระบบนี้แม่นจริงไหม
              <span className="cc-dim cc-sep">·</span>
              <span className="cc-dim" style={{fontSize:11.5,color:"var(--dim)"}}>{perf&&perf.snapshots!=null?perf.snapshots+" snapshot · "+(perf.symbols||0)+" หุ้น":"กำลังสะสมข้อมูล"}</span>
              <a className="cc-conv" style={{textDecoration:"none",marginLeft:"auto"}} href="/performance" target="_blank" rel="noopener noreferrer">ดูเต็ม →</a>
            </div>
            {(hasPaper||hasReal)?(
              <div className="cc-edge-grid">
                {hasPaper?<React.Fragment>
                  <div className="cc-edge-it">
                    <div className="l">BUY ชนะ S&amp;P500 (10 วัน)</div>
                    <div className="v" style={{color:buy10.beatRate>=50?"var(--up)":"var(--down)"}}>{buy10.beatRate!=null?buy10.beatRate+"%":"—"}</div>
                    <div className="s">จาก {buy10.n} สัญญาณ · สุทธิหักต้นทุน {buy10.beatRateNet!=null?buy10.beatRateNet+"%":"—"}{buy10.infoRatio!=null?" · IR "+buy10.infoRatio:""}</div>
                  </div>
                  <div className="cc-edge-it">
                    <div className="l">ผลตอบแทนส่วนเกินเฉลี่ย (10 วัน)</div>
                    <div className="v" style={{color:buy10.avgExcess>=0?"var(--up)":"var(--down)"}}>{buy10.avgExcess!=null?(buy10.avgExcess>=0?"+":"")+buy10.avgExcess+"%":"—"}</div>
                    <div className="s">{buy10.avgExcessNet!=null?"สุทธิ "+(buy10.avgExcessNet>=0?"+":"")+buy10.avgExcessNet+"% (หักต้นทุน)":"เหนือ S&P500 ต่อสัญญาณ BUY"}</div>
                  </div>
                </React.Fragment>:(
                  <div className="cc-edge-it" style={{gridColumn:"span 2"}}>
                    <div className="l">Edge แบบ paper (วัด signal vs ตลาด)</div>
                    <div className="cc-edge-empty">⏳ ต้องมี snapshot ≥ 5 วันทำการจึงเริ่มวัดได้ · cron เก็บให้อัตโนมัติทุกวันหลังตลาดปิด</div>
                  </div>
                )}
                {hasReal?<div className="cc-edge-it">
                  <div className="l">เทรดจริงที่ปิดแล้ว ({tstats.count})</div>
                  <div className="v" style={{color:ts.winRate>=50?"var(--up)":"var(--down)"}}>{ts.winRate!=null?ts.winRate+"%":"—"} <span style={{fontSize:12,fontWeight:600,color:"var(--dim)"}}>win</span></div>
                  <div className="s">{ts.avgR!=null?"เฉลี่ย "+ts.avgR+"R · ":""}{ts.totalPnl!=null?(ts.totalPnl>=0?"+":"")+"$"+Number(ts.totalPnl).toLocaleString():""} ({ts.wins}W/{ts.losses}L)</div>
                </div>:(
                  <div className="cc-edge-it">
                    <div className="l">เทรดจริง</div>
                    <div className="cc-edge-empty">ยังไม่มีเทรดที่ปิด — กด 💰 ขาย ใน Positions เพื่อเริ่มเก็บสถิติ</div>
                  </div>
                )}
                {perf&&perf.byRegime&&(()=>{
                  const rg=perf.byRegime;
                  const items=[["risk-on","🟢"],["neutral","🟡"],["risk-off","🔴"]]
                    .map(([k,ico])=>{const x=rg[k]&&rg[k]["10"]; return (x&&x.n>0)?{k,ico,beat:x.beatRate,n:x.n}:null;}).filter(Boolean);
                  if(!items.length) return null;
                  return (<div className="cc-edge-it" style={{gridColumn:"1/-1"}}>
                    <div className="l">BUY ชนะ S&amp;P500 แยกตามสภาพตลาด (10 วัน) — edge จริงต้องชนะตอน risk-off ด้วย ไม่ใช่แค่ตอนตลาดขึ้น</div>
                    <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:7,fontSize:13.5}}>
                      {items.map(it=>(<span key={it.k}>{it.ico} {it.k} <b style={{color:it.beat>=50?"var(--up)":"var(--down)"}}>{it.beat!=null?it.beat+"%":"—"}</b> <span style={{color:"var(--dim)",fontSize:11}}>n={it.n}</span></span>))}
                    </div>
                  </div>);
                })()}
              </div>
            ):(
              <div className="cc-edge-empty">⏳ กำลังสะสมข้อมูล — ระบบเก็บ snapshot รายวันอัตโนมัติ · ตัวเลข edge จะเริ่มมีหลังมีข้อมูล ≥ 5 วันทำการ และมีเทรดที่ปิดแล้ว</div>
            )}
          </div>
        );
      })()}
      <div className="cc-links">
        {LINKS.map(([ico,lab,href])=>(<a key={href} className="cc-link" href={href} target="_blank" rel="noopener noreferrer">{ico} {lab}</a>))}
        {decideLoading&&<span className="cc-upd">↻ กำลังอัปเดตการตัดสินใจ…</span>}
      </div>
    </div>
  );
}

function App(){
  const [webhook,setWebhook] = useLS("webhook","/api/stocks");
  // Migrate: เครื่องที่เคยใช้เวอร์ชันเก่า webhook ถูกเก็บเป็น "" ใน localStorage → setWebhook เป็น default ครั้งแรกที่เปิด
  // (กัน addSymbol ที่ยัง guard ด้วย !webhook ไปเด้ง settings dialog แทนการเพิ่มหุ้น)
  useEffect(()=>{
    if(!webhook) setWebhook("/api/stocks");
    /* eslint-disable-next-line */
  },[]);
  // เปิด detail modal อัตโนมัติเมื่อถูกเรียกจาก lobby alert — รับ symbol 2 ทาง:
  //   (1) hash ตอนโหลด iframe: dashboard.html#detail=GOOGL  (กรณีหลัก — iframe โหลดใหม่ทุกครั้งที่กด alert)
  //   (2) postMessage {type:'openDetail',sym} จาก parent  (เผื่อ iframe เปิดค้างอยู่แล้วสลับหุ้น)
  // ข้อมูลกราฟ/indicator จะเติมเองเมื่อราคาโหลดเสร็จ (DetailModal re-render ตาม data)
  useEffect(()=>{
    const fromHash = ()=>{ const m=String(location.hash||"").match(/[#&]detail=([^&]+)/); if(m){ try{ const s=decodeURIComponent(m[1]).toUpperCase().trim(); if(s) setDetail(s); }catch(e){} } };
    fromHash();
    const onMsg = (e)=>{ const d=e&&e.data; if(d && d.type==="openDetail" && d.sym) setDetail(String(d.sym).toUpperCase().trim()); };
    window.addEventListener("message", onMsg);
    window.addEventListener("hashchange", fromHash);
    return ()=>{ window.removeEventListener("message", onMsg); window.removeEventListener("hashchange", fromHash); };
  },[]);
  const [autoSec,setAutoSec] = useLS("autoSec",60);
  const [watch,setWatch] = useLS("watch",DEFAULT_WL);  // hydrate ผ่าน useEffect ด้านล่าง (มี seed logic เฉพาะ)
  const [positions,setPositions] = useServerLS("positions",[],"/api/positions");        // ซิงค์ข้ามเครื่อง
  const [live,setLive] = useLS("live",{});  // symbol -> {price,prevClose,closes,...} (cache ราคา ไม่ต้องซิงค์ — โหลดสดเองได้)
  const [fx,setFx] = useLS("fx",{USD:1});  // เรตแลกเงิน: สกุล -> จำนวนสกุลนั้นต่อ 1 USD (เช่น THB:35.4) ใช้แปลงหุ้นต่างตลาด (.BK ฯลฯ) เป็น USD ตอนรวมพอร์ต
  const [decide,setDecide] = useState(null);   // ผล /api/decide (regime, conviction, heat, candidates) — source เดียวของ signal
  const [posWatch,setPosWatch] = useState(null);  // ผล /api/positions-watch (invalidation status)
  const [perf,setPerf] = useState(null);       // /api/performance — edge แบบ paper (BUY ชนะ SPX กี่%)
  const [tstats,setTstats] = useState(null);   // /api/trade-stats — สถิติเทรดจริง (win rate, R, PnL)
  const [mkt,setMkt] = useState(()=>usMarketStatus());  // สถานะตลาดสหรัฐ (เปิด/ปิด)
  const [decideLoading,setDecideLoading] = useState(false);
  const [defense,setDefense] = useState(null);   // /api/defense — M36 Portfolio Defense (deterministic)
  const [scenario,setScenario] = useState(null); // /api/scenario — M38 Portfolio Scenario (deterministic)
  const [riskConfig,setRiskConfig] = useState(null);  // เงินทุน+%เสี่ยง (สำหรับ Heat/sizing) — /api/riskconfig
  const [alertCfg,setAlertCfg] = useServerLS("alertCfg",DEFAULT_ALERTS,"/api/alerts");  // สวิตช์ Telegram alerts — ซิงค์ข้ามเครื่อง (alerts worker ใช้ค่าจากที่นี่ทีหลังก็ได้)
  function toggleAlert(key,val){ setAlertCfg(prev=>({...prev,[key]:val})); }
  function toggleEma(p,val){ setAlertCfg(prev=>({...prev,ema:{...prev.ema,[p]:val}})); }
  const [status,setStatus] = useState({state:"idle",msg:"ยังไม่ซิงค์",time:null});
  const [loading,setLoading] = useState(false);
  const [showSet,setShowSet] = useState(false);
  const [detail,setDetail] = useState(null);     // symbol string
  const [addSym,setAddSym] = useState("");
  const [theme,setTheme] = useLS("theme","dark");        // สลับธีม สว่าง/มืด (เก็บใน localStorage)
  const [sortBy,setSortBy] = useState("default");        // เรียง watchlist
  const [filt,setFilt] = useState("all");                // กรอง watchlist: ทั้งหมด/ขึ้น/ลง
  const [wlQuery,setWlQuery] = useState("");             // ค้นหาหุ้นใน watchlist (substring symbol)
  const [wlView,setWlView] = useLS("wlView","table");    // มุมมอง watchlist: ตาราง/การ์ด (จำไว้ใน localStorage)
  const [wide,setWide] = useState(()=>typeof window!=="undefined"&&window.matchMedia("(min-width:1080px)").matches); // จอกว้างพอทำ master-detail (พาเนลขวา) ไหม
  useEffect(()=>{ const mq=window.matchMedia("(min-width:1080px)"); const h=e=>setWide(e.matches);
    mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);
    return ()=>{ mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h); }; },[]);
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); },[theme]);

  const symbols = useMemo(()=>{
    const s = new Set(watch.map(w=>w.symbol));
    positions.forEach(p=>s.add(p.symbol));
    return [...s];
  },[watch,positions]);

  const refresh = useCallback(async ()=>{
    const wh = webhook || "/api/stocks";  // ค่าว่าง = ใช้ same-origin proxy ของ CF Worker (ไม่ต้องตั้งค่า n8n)
    if(symbols.length===0) return;
    setLoading(true);
    try{
      // เพิ่ม ^GSPC เข้า fetch (สำหรับคำนวณ RS vs S&P500) — ไม่แสดงในตาราง ไม่นับรวม count
      // ดึงเฉพาะราคา (chart) — decide/posWatch แยกไปรอบช้ากว่า (เปลี่ยนช้า ไม่ต้องดึงทุก 60 วิ)
      const rows = await fetchStocks([...new Set([...symbols,"^GSPC"])], wh);
      const map={};
      rows.forEach(r=>{ if(r && r.symbol) map[r.symbol.toUpperCase()]=r; });
      setLive(prev=>({...prev,...map}));
      const okCount = rows.filter(r=>r&&r.ok!==false&&r.price!=null && r.symbol.toUpperCase()!=="^GSPC").length;
      setStatus({state: okCount>0?"ok":"err", msg: okCount>0? ("โหลด "+okCount+"/"+symbols.length+" ตัว") : "ไม่ได้ข้อมูล", time:new Date()});
    }catch(e){
      setStatus({state:"err", msg: e.message==="NO_WEBHOOK"?"ยังไม่ตั้งแหล่งราคา":("ผิดพลาด: "+e.message), time:new Date()});
    }finally{ setLoading(false); }
  },[webhook,symbols]);

  // decide/posWatch — ดึงแยกรอบช้ากว่าราคา (signal/regime เปลี่ยนช้า ไม่ต้องดึงทุก 60 วิ) ลดโหลด worker
  const refreshDecide = useCallback(async ()=>{
    setDecideLoading(true);
    try{
      await Promise.all([
        fetch("/api/decide",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&!d.error) setDecide(d); }),
        fetch("/api/positions-watch",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.ok) setPosWatch(d); }),
        fetch("/api/performance",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.ok) setPerf(d); }),
        fetch("/api/trade-stats",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.ok) setTstats(d); }),
        fetch("/api/defense",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&!d.error) setDefense(d); }),
        fetch("/api/scenario",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.ok) setScenario(d); }),
      ]);
    }catch(e){}finally{ setDecideLoading(false); }
  },[]);
  useEffect(()=>{
    refreshDecide();
    fetch("/api/riskconfig",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&typeof d==="object"&&!Array.isArray(d)) setRiskConfig(d); }).catch(()=>{});
    const id=setInterval(refreshDecide, 300*1000);  // decide รอบ 5 นาที
    return ()=>clearInterval(id);
  },[refreshDecide]);
  // อัปเดตสถานะตลาด (เปิด/ปิด) ทุกนาที
  useEffect(()=>{ const id=setInterval(()=>setMkt(usMarketStatus()),60*1000); return ()=>clearInterval(id); },[]);

  // Watchlist เก็บบน server (KV ของ stock-dashboard worker) — เปิดจากเครื่องไหนเห็นข้อมูลเดียวกัน
  // localStorage = cache โหลดทันที, server = source of truth (sync ทับเสมอเมื่อ GET สำเร็จ)
  // first-time setup: ถ้า server ว่าง → seed จาก stock-alerts/api/levels แล้ว POST กลับ
  const [hydrated,setHydrated] = useState(false);
  const watchWriteRef = useRef(0);  // เวลาที่เพิ่งแก้ watch ในเครื่องนี้ — กัน focus-refresh ดึง stale จาก server มาทับ
  useEffect(()=>{
    let cancelled=false;
    (async ()=>{
      try{
        const res = await fetch("/api/watchlist", {cache:"no-store"});
        const srv = res.ok ? await res.json() : null;
        if(cancelled) return;
        // srv===null → ยังไม่เคย seed (KV ว่าง) → ทำ seed
        // srv===[] → user ตั้งใจล้าง watchlist → เคารพ (ไม่ re-seed)
        // srv=[...] → ใช้ของ server (ทับ cache localStorage)
        if(srv !== null){
          setWatch(Array.isArray(srv) ? srv : []);
          setHydrated(true);
          return;
        }
        // KV ว่างจริงๆ (ยังไม่เคยเขียน) → seed จาก alerts levels
        let seeded = null;
        try{
          const lvRes = await fetch("https://stock-alerts.suvit-ler.workers.dev/api/levels");
          const lv = lvRes.ok ? await lvRes.json() : {};
          setWatch(prev=>{
            const have = new Set(prev.map(w=>w.symbol));
            const merged = prev.map(w=>{
              const L = lv[w.symbol]; if(!L) return w;
              return { ...w, entry: w.entry||L.entry||0, sl: w.sl||L.sl||0, tp: w.tp||L.tp||0 };
            });
            for(const sym of Object.keys(lv||{})){
              if(!have.has(sym)){ const L=lv[sym]; merged.push({symbol:sym, entry:L.entry||0, sl:L.sl||0, tp:L.tp||0, note:""}); }
            }
            seeded = merged;
            return merged;
          });
          // POST seed กลับ server เพื่อให้เครื่องอื่นเห็นชุดเดียวกัน
          if(seeded){
            fetch("/api/watchlist", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(seeded)}).catch(()=>{});
          }
        }catch(e){/* seed ล้มก็ยังเปิดได้ ใช้ DEFAULT_WL */}
        setHydrated(true);
      }catch(e){ if(!cancelled) setHydrated(true); }
    })();
    return ()=>{ cancelled=true; };
  },[]);
  // บันทึก watch ทุกครั้งที่เปลี่ยน (debounce 1.2 วิ) — เฉพาะหลัง hydrate เสร็จ กัน POST ทับ server ตอนยังโหลดไม่จบ
  useEffect(()=>{
    if(!hydrated) return;
    watchWriteRef.current = Date.now();  // มาร์คว่าเพิ่งแก้ในเครื่องนี้
    const t = setTimeout(()=>{
      fetch("/api/watchlist", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(watch)}).catch(()=>{});
    }, 1200);
    return ()=>clearTimeout(t);
  },[hydrated,watch]);
  // ดึง watchlist ใหม่จาก server ตอนกลับมาที่ tab — จับ edits จากเครื่องอื่น
  useEffect(()=>{
    if(!hydrated) return;
    const onFocus = async ()=>{
      // กัน race: ถ้าเพิ่งแก้ในเครื่องนี้ (เช่น เพิ่งกดคำนวณ/เพิ่มหุ้น แล้ว confirm dialog ทำให้ refocus)
      // อย่าดึง stale จาก server มาทับ — รอให้ POST ขึ้นไป propagate ก่อน
      if(Date.now() - watchWriteRef.current < 3500) return;
      try{
        const res = await fetch("/api/watchlist", {cache:"no-store"});
        if(!res.ok) return;
        const srv = await res.json();
        if(Array.isArray(srv) && JSON.stringify(srv)!==JSON.stringify(watch)) setWatch(srv);
      }catch(e){}
    };
    const onVis = ()=>{ if(!document.hidden) onFocus(); };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVis);
    return ()=>{
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVis);  // ลบให้ครบ — เดิมรั่ว สะสม listener ทุกครั้งที่ watch เปลี่ยน
    };
    /* eslint-disable-next-line */
  },[hydrated,watch]);

  // initial + auto refresh — รันเสมอ (default = /api/stocks)
  useEffect(()=>{ refresh(); /* eslint-disable-next-line */ },[webhook]);
  useEffect(()=>{
    if(!autoSec) return;
    const id=setInterval(refresh, Math.max(30,autoSec)*1000);
    return ()=>clearInterval(id);
  },[autoSec,refresh]);

  // ดึงเรต FX ของหุ้นต่างสกุล (เช่น .BK = THB) ที่โผล่ใน live — แปลงเป็น USD ให้พอร์ตรวมถูกต้อง
  // ใช้สัญลักษณ์ Yahoo "<CUR>=X" (= จำนวนสกุลนั้นต่อ 1 USD) ผ่าน proxy เดิม → usd = native / rate
  useEffect(()=>{
    const need=new Set();
    Object.values(live).forEach(r=>{ const c=r&&r.currency; if(c&&c!=="USD") need.add(c); });
    const missing=[...need].filter(c=>fx[c]==null);
    if(missing.length===0) return;
    fetchStocks(missing.map(c=>c+"=X"), webhook||"/api/stocks").then(rows=>{
      const upd={};
      rows.forEach(r=>{ if(r&&r.symbol&&r.price!=null){ const c=String(r.symbol).replace(/=X$/i,"").toUpperCase(); if(c&&c!=="USD") upd[c]=r.price; } });
      if(Object.keys(upd).length) setFx(prev=>({...prev,...upd}));
    }).catch(()=>{});
    /* eslint-disable-next-line */
  },[live]);

  // derived per-symbol bundle
  const data = useMemo(()=>{
    const out={};
    // signal/conviction จาก worker (/api/decide) = source เดียว · fallback signalOf client ถ้า worker ยังไม่มีตัวนั้น
    const sigBySym={};
    const cands=(decide&&[...(decide.candidates||[]),...(decide.core||[])])||[];
    cands.forEach(c=>{ if(c&&c.symbol) sigBySym[c.symbol.toUpperCase()]={signal:c.signal,conviction:c.conviction,stance:c.stance,dims:c.dims,wreason:c.reason,changePct:c.changePct}; });
    // %เปลี่ยนของ S&P500 วันนี้ (จาก ^GSPC ที่ refresh ดึงมา) — ฐานคำนวณ RS ของทุกหุ้น
    let spxChg=null;
    const spx=live["^GSPC"];
    // ^GSPC ดึงผ่าน /api/stocks range=1y -> prevClose = 1 ปีก่อน ใช้ไม่ได้ · ใช้ closes[-2] (ปิดเมื่อวานจริง)
    if(spx && spx.closes && spx.closes.length>=2 && spx.price!=null){
      const cl=spx.closes, last=cl[cl.length-1];
      const isToday=Math.abs(last-spx.price)<=Math.max(spx.price*0.001,0.02);
      const pc=isToday?cl[cl.length-2]:last;
      if(pc) spxChg=(spx.price-pc)/pc*100;
    }
    for(const sym of symbols){
      const l=live[sym];
      const closes = l && l.closes;
      const ind = computeIndicators(closes, l&&l.ohlc, l&&l.volumes);
      const price = l ? l.price : null;
      // %เปลี่ยนรายวัน = เทียบราคาปิด "เมื่อวาน" (closes[-2]) ไม่ใช่ราคา 1 ปีก่อน
      // closes[-1] คือแท่ง "วันนี้" (live) ที่เท่ากับราคาปัจจุบัน -> ใช้แท่งก่อนหน้าเป็นฐานเทียบ
      // เกณฑ์เทียบแบบ relative (ไม่ใช่ 1e-6 ที่แน่นเกินไปจน float ลอดได้)
      let prevC = null;
      if(closes && closes.length>=2){
        const last = closes[closes.length-1];
        const lastIsToday = price!=null && Math.abs(last - price) <= Math.max(price*0.001, 0.02);
        prevC = lastIsToday ? closes[closes.length-2] : last;
      }
      const chg = (price!=null && prevC) ? (price - prevC) : null;
      const chgPct = (price!=null && prevC) ? (chg / prevC * 100) : null;
      // ราคานอกเวลาทำการ (post = หลังปิด, pre = ก่อนเปิด) เทียบกับราคาปิดปกติ — ไม่ยุ่งกับ indicator
      let extra = null;
      if(l && l.extra && l.extra.price!=null && price!=null){
        const ex = l.extra;
        const exChg = ex.price - price;
        extra = { type: ex.type, price: ex.price, chg: exChg, chgPct: price? (exChg/price*100) : null };
      }
      // unify ราคาฐาน signal = livePrice (รวม pre/post) + RS vs S&P500 ให้ตรงกับ worker ทั้ง 2 ตัว
      const livePrice = (l && l.extra && l.extra.price!=null) ? l.extra.price : price;
      if(ind){
        if(livePrice!=null) ind.price = livePrice;
        const chgLive = (livePrice!=null && prevC) ? (livePrice - prevC)/prevC*100 : null;
        ind.rsVsSpx = (chgLive!=null && spxChg!=null) ? +(chgLive - spxChg).toFixed(2) : null;
      }
      // signalOf ฝั่ง client = ใช้สร้าง "เหตุผลประกอบ" เท่านั้น — ป้าย BUY/HOLD/SELL มาจาก worker (conviction) เสมอ
      // ถ้า worker ยังไม่ส่ง signal มา (decide กำลังโหลด) → แสดง "—" ไม่เดาป้ายเองฝั่ง client (กัน label drift)
      const localSig=signalOf(ind);
      const ws=sigBySym[sym.toUpperCase()];
      const sig = (ws&&ws.signal)
        ? {label:ws.signal,cls:(ws.signal||"hold").toLowerCase(),reasons:localSig.reasons,score:localSig.score,dims:ws.dims,wreason:ws.wreason}
        : {label:"—",cls:"na",reasons:localSig.reasons,score:localSig.score,dims:ws&&ws.dims,wreason:ws&&ws.wreason};
      // %เปลี่ยนวันนี้ = ใช้ค่าจาก worker (/api/decide) เป็น source เดียวถ้ามี — กัน client cache (live ใน localStorage) ค้างแล้วโชว์ % เพี้ยน (เช่น CRWV +9.67% ค้าง ทั้งที่จริง +0.77%)
      let dayChg=chg, dayChgPct=chgPct;
      if(ws && ws.changePct!=null && price!=null){
        dayChgPct = ws.changePct;
        const pc = price/(1+ws.changePct/100);   // ฐานเทียบที่ implied จาก % ของ worker → chg สัมบูรณ์สอดคล้องกัน (ใช้ใน day P/L พอร์ต)
        dayChg = (isFinite(pc) && pc>0) ? price - pc : chg;
      }
      out[sym]={price,chg:dayChg,chgPct:dayChgPct,closes,ohlc:l&&l.ohlc,ind,sig,conviction:(ws?ws.conviction:null),stance:(ws?ws.stance:null),ok:l?l.ok!==false:false,name:l&&l.name,extra,currency:(l&&l.currency)||"USD"};
    }
    return out;
  },[symbols,live,decide]);

  // portfolio KPIs
  const port = useMemo(()=>{
    let cost=0,val=0,day=0; const missing=new Set(); let anyNonUsd=false;
    positions.forEach(p=>{
      const d=data[p.symbol]; const px=d&&d.price;
      const cur=(d&&d.currency)||"USD";
      if(cur!=="USD") anyNonUsd=true;
      const rate = cur==="USD"?1:(fx[cur]||null);
      if(rate==null && cur!=="USD") missing.add(cur);
      const r = rate||1;                                   // ยังไม่มีเรต → ใช้ native ชั่วคราว (โชว์ warning ด้านบน)
      cost += (p.cost*p.qty)/r;
      if(px){ val += (px*p.qty)/r; if(d.chg) day += (d.chg*p.qty)/r; }
    });
    const capital=(riskConfig&&+riskConfig.capital)||0;
    return {cost,val,pl:val-cost,plPct: cost?((val-cost)/cost*100):0, day,
            fxMissing:[...missing], anyNonUsd, capital,
            cash: capital>0?capital-cost:null,
            deployedPct: capital>0?cost/capital*100:null};
  },[positions,data,fx,riskConfig]);

  // สรุปการเคลื่อนไหววันนี้ของ watchlist (ขึ้นกี่ตัว/ลงกี่ตัว + ตัวเด่น/ตัวร่วงสุด)
  const movers = useMemo(()=>{
    let up=0,down=0,best=null,worst=null;
    watch.forEach(w=>{ const d=data[w.symbol]; if(!d||d.chgPct==null) return;
      if(d.chgPct>=0) up++; else down++;
      if(!best||d.chgPct>best.chgPct) best={symbol:w.symbol,chgPct:d.chgPct};
      if(!worst||d.chgPct<worst.chgPct) worst={symbol:w.symbol,chgPct:d.chgPct};
    });
    return {up,down,best,worst};
  },[watch,data]);

  // ข้อมูลต่อแถว (ใช้ร่วมกันทั้งมุมมองตาราง + การ์ด ให้ logic ตรงกันเสมอ)
  const rowInfo = w=>{
    const d=data[w.symbol]||{};
    const ind=d.ind, sig=d.sig||{label:"—",cls:"na"};
    const rsiVal=ind&&ind.rsi;
    const rsiCol = rsiVal==null?"#646b7a": rsiVal>70?"#f87171": rsiVal<35?"#4ade80":"#9aa3b2";
    const isNew = d.price!=null && !ind;   // มีราคาแล้วแต่ข้อมูลย้อนหลังไม่พอ → หุ้นเพิ่งเข้าตลาด
    return {d,ind,sig,rsiVal,rsiCol,isNew};
  };

  // watchlist ที่กรอง+เรียงแล้ว (ไม่แตะ watch จริง — แค่ลำดับการแสดงผล)
  const shownWatch = useMemo(()=>{
    let arr=[...watch];
    if(wlQuery.trim()){ const q=wlQuery.trim().toUpperCase(); arr=arr.filter(w=>w.symbol.toUpperCase().includes(q)); }
    if(filt!=="all") arr=arr.filter(w=>{ const d=data[w.symbol]; if(!d||d.chgPct==null) return false; return filt==="up"?d.chgPct>=0:d.chgPct<0; });
    const g=w=>{ const d=data[w.symbol]||{}; const ind=d.ind||{}; return {chg:d.chgPct,rsi:ind.rsi,sig:d.sig&&d.sig.score}; };
    const n=(v,f)=>v==null?f:v;
    if(sortBy==="chg")        arr.sort((a,b)=>n(g(b).chg,-1e9)-n(g(a).chg,-1e9));
    else if(sortBy==="chgUp") arr.sort((a,b)=>n(g(a).chg,1e9)-n(g(b).chg,1e9));
    else if(sortBy==="rsi")   arr.sort((a,b)=>n(g(b).rsi,-1)-n(g(a).rsi,-1));
    else if(sortBy==="rsiLow")arr.sort((a,b)=>n(g(a).rsi,999)-n(g(b).rsi,999));
    else if(sortBy==="sig")   arr.sort((a,b)=>n(g(b).sig,-99)-n(g(a).sig,-99));
    else if(sortBy==="az")    arr.sort((a,b)=>a.symbol.localeCompare(b.symbol));
    // หุ้นที่มีราคาแล้วแต่ข้อมูลย้อนหลังไม่พอ (หุ้นเพิ่งเข้าตลาด) → ดันไปล่างสุดเสมอ ไม่ให้แถว "—" คั่นกลาง
    const ready=[],late=[];
    for(const w of arr){ const d=data[w.symbol]; (d&&d.price!=null&&!d.ind)?late.push(w):ready.push(w); }
    return [...ready,...late];
  },[watch,data,sortBy,filt,wlQuery]);

  async function addSymbol(){
    const s=addSym.trim().toUpperCase(); if(!s) return;
    if(watch.some(w=>w.symbol===s)){ setAddSym(""); return; }
    const wh = webhook || "/api/stocks";  // กัน webhook ค่าง=="" ใน localStorage เครื่องเก่า
    // เช็คก่อนว่า Yahoo มีหุ้นตัวนี้จริงไหม — ถ้าไม่เจอจะไม่เพิ่ม (กันพิมพ์ผิดแบบ NAVD/NVDA)
    setLoading(true);
    try{
      const rows = await fetchStocks([s], wh);
      const row = rows.find(r=>r&&r.symbol&&r.symbol.toUpperCase()===s) || rows[0];
      const ok = row && row.ok!==false && row.price!=null;
      if(!ok){
        setStatus({state:"err", msg:'ไม่พบหุ้น "'+s+'" ใน Yahoo — เช็คตัวสะกด', time:new Date()});
        alert('ไม่พบหุ้น "'+s+'" ใน Yahoo Finance\n\n• เช็คตัวสะกดอีกครั้ง (เช่น NVDA ไม่ใช่ NAVD)\n• หุ้นไทยต้องมี .BK ต่อท้าย เช่น PTT.BK, KBANK.BK\n• กองทุน/ETF บางตัวอาจไม่มีใน Yahoo');
        return;
      }
      // คำนวณแผน Entry/SL/TP อัตโนมัติจาก indicators ของหุ้นที่เพิ่งดึงมา (RR 1:2) — ไม่ต้องกดคำนวณเอง
      const ind = computeIndicators(row.closes);
      const plan = ind ? suggestPlan(ind) : null;
      watchWriteRef.current = Date.now();  // มาร์คก่อน setWatch กัน focus-refresh ทับ
      setWatch([...watch,{symbol:s, entry: plan?plan.entry:0, sl: plan?plan.sl:0, tp: plan?plan.tp:0, note:""}]);
      setLive(prev=>({...prev,[s]:row}));
      setAddSym("");
      setStatus({state:"ok", msg: plan ? ("เพิ่ม "+s+" + คำนวณแผนแล้ว") : ("เพิ่ม "+s+" แล้ว (ข้อมูลไม่พอคำนวณแผน)"), time:new Date()});
    }catch(e){
      setStatus({state:"err", msg:"เพิ่ม "+s+" ไม่ได้: "+e.message, time:new Date()});
    }finally{ setLoading(false); }
  }
  function removeSym(s){ watchWriteRef.current=Date.now(); setWatch(watch.filter(w=>w.symbol!==s)); }
  function updateWatch(s,patch){ watchWriteRef.current=Date.now(); setWatch(watch.map(w=>w.symbol===s?{...w,...patch}:w)); }
  // คำนวณแผน Entry/SL/TP ใหม่ทุกตัวในครั้งเดียว (RR 1:2 จากอินดิเคเตอร์)
  function recalcAllPlans(){
    if(!confirm("คำนวณแผน Entry/SL/TP ใหม่ทั้งหมด (RR 1:2)?\nจะทับค่าที่ตั้งไว้เดิม")) return;
    let n=0;
    const next=watch.map(w=>{
      const d=data[w.symbol];
      const plan=(d&&d.ind)?suggestPlan(d.ind):null;
      if(plan){ n++; return {...w, entry:plan.entry, sl:plan.sl, tp:plan.tp}; }
      return w;
    });
    watchWriteRef.current = Date.now();  // มาร์คก่อน setWatch — กัน focus event จาก confirm() ทับแผนที่เพิ่งคำนวณ
    setWatch(next);
    setStatus({state:"ok",msg:"คำนวณแผนใหม่ "+n+"/"+watch.length+" ตัว (RR 1:2)",time:new Date()});
  }
  function updatePos(id,patch){ setPositions(positions.map(p=>p.id===id?{...p,...patch}:p)); }


  return (
    <div className={"wrap"+(detail&&wide?" dock-open":"")}>
      <div className="topbar">
        <div className="brand">
          <div className="mark">📈</div>
          <div><h1 className="head-font">Stock Dashboard</h1><p>ARIA · YAHOO via Cloudflare</p></div>
        </div>
        <div className="toolbar">
          {mkt && <div className="status" title="เวลาทำการตลาดหุ้นสหรัฐ (เขตเวลา ET) — ไม่รวมวันหยุดนักขัตฤกษ์">
            <span className={"dot "+(mkt.open?"ok":"idle")}></span>
            {mkt.open?"🟢":mkt.pre?"🌅":"🌙"} {mkt.label}
          </div>}
          <div className="status">
            <span className={"dot "+(status.state==="ok"?"ok":status.state==="err"?"err":"idle")}></span>
            {status.msg}{status.time && <span style={{color:"var(--dim)"}}>· {status.time.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}</span>}
          </div>
          <button className="btn ghost sm" onClick={()=>{refresh();refreshDecide();}} disabled={loading} title="โหลดราคา + การตัดสินใจใหม่">{loading?"กำลังโหลด…":"↻ รีเฟรช"}</button>
          <button className="btn ghost sm" onClick={()=>setTheme(theme==="dark"?"light":"dark")} title={theme==="dark"?"สลับเป็นธีมสว่าง":"สลับเป็นธีมมืด"}>{theme==="dark"?"☀️":"🌙"}</button>
          <button className="btn ghost sm" onClick={()=>setShowSet(true)}>⚙ ตั้งค่า</button>
        </div>
      </div>


      {/* Command Center — decision-first */}
      <CommandCenter decide={decide} posWatch={posWatch} perf={perf} tstats={tstats} defense={defense} scenario={scenario} onPick={setDetail} decideLoading={decideLoading}/>

      {/* เตือนระหว่างเรตแลกเงินยังโหลดไม่เสร็จ — พอร์ตอาจปนสกุลชั่วคราว */}
      {port.fxMissing.length>0 && (
        <div style={{margin:"0 0 14px",padding:"9px 14px",borderRadius:12,background:"rgba(245,158,11,.1)",border:"1px solid rgba(245,158,11,.3)",color:"#f59e0b",fontSize:12.5,fontWeight:600}}>
          ⚠️ กำลังแปลงค่าเงิน {port.fxMissing.join(", ")} → USD · มูลค่าพอร์ตอาจยังไม่รวมหุ้นต่างสกุลถูกต้องชั่วคราว
        </div>
      )}

      {/* KPIs */}
      <div className="kpis">
        <div className="kpi"><div className="lab">มูลค่าพอร์ต{port.anyNonUsd&&<span style={{fontSize:10,fontWeight:600,color:"var(--dim)",marginLeft:5}}>USD รวม</span>}</div><div className="val mono">${fmt(port.val,0)}</div><div className="meta">ต้นทุน ${fmt(port.cost,0)}</div></div>
        <div className="kpi"><div className="lab">กำไร/ขาดทุนรวม</div><div className={"val mono "+(port.pl>=0?"up":"down")}>{port.pl>=0?"+":""}${fmt(port.pl,0)}</div><div className="meta">{port.pl>=0?"+":""}{fmt(port.plPct)}%</div></div>
        <div className="kpi"><div className="lab">วันนี้</div><div className={"val mono "+(port.day>=0?"up":"down")}>{port.day>=0?"+":""}${fmt(port.day,0)}</div><div className="meta">เปลี่ยนแปลงวันนี้</div></div>
        <div className="kpi"><div className="lab">เงินสด / ลงทุนแล้ว</div>
          {port.capital>0
            ? <React.Fragment><div className={"val mono "+(port.cash<0?"down":"")}>${fmt(port.cash,0)}</div><div className="meta">ลงไป {fmt(port.deployedPct,0)}% ของ ${fmt(port.capital,0)}{port.cash<0&&<span className="down"> · เกินทุน</span>}{riskConfig&&port.cash>0&&<span> · เฉยๆได้ ~${fmt(port.cash*(riskConfig.riskFreePct||4.5)/100,0)}/ปี ({riskConfig.riskFreePct||4.5}%)</span>}</div></React.Fragment>

                  </td>

                  </td>

              );

          </tbody>
        </table>
        </div>}
        {wlView==="card" && <div className="wl-cards">
          {shownWatch.map(w=>{
            const {d,sig,rsiVal,rsiCol,isNew}=rowInfo(w);
            const hasPlan = w.entry||w.sl||w.tp;
            return (
              <div key={w.symbol} className={"wl-card click"+(isNew?" row-new":"")+(detail===w.symbol?" sel":"")} onClick={()=>setDetail(w.symbol)}>
                <div className="wl-card-top">

                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {isNew
                      ? <span className="pill new" title="ข้อมูลย้อนหลังไม่พอคำนวณอินดิเคเตอร์ (~15 วันทำการ) — มักเป็นหุ้นเพิ่งเข้าตลาด">🆕 หุ้นใหม่</span>
                      : <span className={"pill "+sig.cls}>{sig.label}</span>}
                    <button className="btn danger sm" onClick={e=>{e.stopPropagation();removeSym(w.symbol);}}>✕</button>
                  </div>
                </div>
                <div className="wl-card-px">
                  <span className="mono" style={{fontSize:20,fontWeight:700}}>{d.price!=null?fmt(d.price):"—"}</span>

                  {d.extra && <span className={"ah "+(d.extra.chg>=0?"up":"down")}>{d.extra.type==="pre"?"pre ":"post "}{fmt(d.extra.price)}</span>}
                </div>
                <div className="wl-card-spark">
                  {isNew
                    ? <span className="spark-na" title="ยังไม่มีราคาปิดสะสมพอวาดกราฟ — หุ้นเพิ่งเข้าตลาด">รอข้อมูล</span>

                </div>
                <div className="wl-card-foot">
                  {rsiVal!=null
                    ? <span className="rsi-b mono" style={{color:rsiCol,background:rsiCol+"18"}} title="RSI 14">{rsiVal.toFixed(0)}</span>
                    : <span style={{color:"var(--dim)",fontSize:12}}>RSI —</span>}
                  {d.conviction!=null && <span className="cc-conv">conv {d.conviction}</span>}
                  {hasPlan
                    ? <span className="mono" style={{marginLeft:"auto",fontSize:11.5,color:"var(--muted)"}} title="Entry / SL / TP">{fmt(w.entry)}/{fmt(w.sl)}/{fmt(w.tp)}</span>
                    : <span style={{marginLeft:"auto",fontSize:11,color:"var(--dim)",opacity:.6}}>ยังไม่ตั้งแผน</span>}

        </div>}
        {watch.length===0 && <div className="empty">ยังไม่มีหุ้นใน watchlist — เพิ่มด้านบน</div>}
        {watch.length>0 && shownWatch.length===0 && <div className="empty">ไม่มีหุ้นตรงตามตัวกรอง — ลองเปลี่ยนเป็น "ทั้งหมด"</div>}
      </div>


      {/* Telegram alert switches */}
      <div className="section">

        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"4px 18px",padding:"4px 2px"}}>

        </div>

        <div style={{display:"flex",gap:"4px 22px",flexWrap:"wrap"}}>

    </div>
  );
