/* ---------- sparkline ---------- */
let _sparkId=0;
function Spark({data,color="#60a5fa",w=92,h=30,full=false}){
  if(!data||data.length<3) return <span style={{color:"var(--dim)"}}>—</span>;
  if(full){ w=240; h=46; }
  const d=data.slice(-60);
  const min=Math.min(...d),max=Math.max(...d),rng=(max-min)||1;
  const line=d.map((v,i)=>`${(i/(d.length-1))*w},${h-((v-min)/rng)*(h-5)-3}`).join(" ");
  const area=`0,${h} `+line+` ${w},${h}`;
  const first=d[0],last=d[d.length-1], pct=first?((last-first)/first*100):0;
  const gid="sg"+(_sparkId++);   // counter เดินหน้า → id ไม่ชนกัน (เลี่ยง Math.random ที่อาจซ้ำ)
  const svgProps = full
    ? {viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:"none",style:{display:"block",width:"100%",height:h}}
    : {width:w,height:h,style:{display:"block"}};
  return <svg {...svgProps}>
    <title>{`60 วันล่าสุด · ${min.toFixed(2)}–${max.toFixed(2)} (${pct>=0?"+":""}${pct.toFixed(1)}%)`}</title>
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.26"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <polygon points={area} fill={`url(#${gid})`}/>
    <polyline points={line} fill="none" stroke={color} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke"/>
  </svg>;
}

/* ---------- toggle switch ---------- */
function Toggle({on,onChange,label,color="#22c55e"}){
  return (
    <button type="button" onClick={()=>onChange(!on)}
      style={{display:"flex",alignItems:"center",gap:9,background:"none",border:"none",cursor:"pointer",padding:"5px 0",textAlign:"left"}}>
      <span style={{width:38,height:22,borderRadius:11,background:on?color:"var(--track)",position:"relative",transition:"background .15s",flexShrink:0,display:"inline-block"}}>
        <span style={{position:"absolute",top:2,left:on?18:2,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .15s",boxShadow:"0 1px 2px rgba(0,0,0,.4)"}}></span>
      </span>
      <span style={{fontSize:13,color:on?"var(--txt)":"var(--dim)"}}>{label}</span>
    </button>
  );
}

/* ---------- price + EMA multi-line chart ---------- */
// กราฟแท่งเทียน (candlestick) + เส้น EMA ทับ — ถ้าไม่มี ohlc (เช่น n8n เก่า) จะ fallback เป็นเส้นราคา
function EmaChart({closes, ohlc, show, w=560, h=240}){
  const hasCandle = Array.isArray(ohlc) && ohlc.length>=20;
  if(!hasCandle && (!closes||closes.length<20)) return <div className="empty">ข้อมูลไม่พอวาดกราฟ (ต้องมีอย่างน้อย 20 วัน)</div>;
  const UP="#22c55e", DOWN="#ef4444";  // เขียว=ปิดสูงกว่าเปิด, แดง=ปิดต่ำกว่าเปิด
  const padX=8, padT=10, padB=10;
  const Y=(v,min,rng)=> padT + (1-(v-min)/rng)*(h-padT-padB);
  const series=EMA_DEFS.filter(d=>show[d.p]);

  if(hasCandle){
    const N=Math.min(ohlc.length,120);          // โชว์ ~120 แท่งล่าสุด (อ่านง่ายกว่าอัด 250 แท่ง)
    const start=ohlc.length-N;
    const bars=ohlc.slice(start);
    // EMA: คำนวณจาก closes เต็ม แล้ว slice ให้ตรง window ของแท่งเทียน (closes กับ ohlc ยาวเท่ากัน)
    const cStart=(closes?closes.length:bars.length)-N;
    const emaS=series.map(d=>({...d, vals: emaFull(closes||bars.map(b=>b.c),d.p).slice(cStart)}));
    let lo=Infinity, hi=-Infinity;
    bars.forEach(b=>{ if(b.l<lo)lo=b.l; if(b.h>hi)hi=b.h; });
    emaS.forEach(s=>s.vals.forEach(v=>{ if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } }));
    const rng=(hi-lo)||1;
    const padL=8, padR=52;                       // เว้นขวาไว้โชว์ "แกนราคา"
    const innerW=w-padL-padR, cw=innerW/N, bodyW=Math.max(1.2, cw*0.62);
    const cx=i=> padL + (i+0.5)*cw;
    const linePts=arr=> arr.map((v,i)=> v==null?null:(cx(i).toFixed(1)+","+Y(v,lo,rng).toFixed(1))).filter(Boolean).join(" ");
    const last=bars[bars.length-1];
    const lastCol=last.c>=last.o?UP:DOWN, yLast=Y(last.c,lo,rng);
    const axLab=(v)=> v>=1000?fmt(v,0):fmt(v,2);  // ป้ายราคาบนแกน
    const NT=4, ticks=Array.from({length:NT+1},(_,k)=>lo+(hi-lo)*k/NT);
    return (
      <div>
        <svg width="100%" viewBox={"0 0 "+w+" "+h} style={{display:"block",background:"var(--chartbg)",borderRadius:10,border:"1px solid var(--line)"}}>
          {/* เส้นกริด + ป้ายราคา (แกนขวา) — ให้อ่านระดับราคาของแต่ละแท่งได้ */}
          {ticks.map((t,k)=>{ const y=Y(t,lo,rng); return (<g key={"ax"+k}>
            <line x1={padL} x2={w-padR} y1={y.toFixed(1)} y2={y.toFixed(1)} stroke="#2a3140" strokeWidth="0.6" opacity="0.55"/>
            <text x={w-padR+5} y={(y+3.5).toFixed(1)} fontSize="11" fontFamily="monospace" fill="#7a8496">{axLab(t)}</text>
          </g>); })}
          {bars.map((b,i)=>{ const col=b.c>=b.o?UP:DOWN; const x=cx(i);
            const yo=Y(b.o,lo,rng), yc=Y(b.c,lo,rng); const top=Math.min(yo,yc); const bh=Math.max(1,Math.abs(yc-yo));
            return (<g key={i}>
              <line x1={x} x2={x} y1={Y(b.h,lo,rng).toFixed(1)} y2={Y(b.l,lo,rng).toFixed(1)} stroke={col} strokeWidth="1"/>
              <rect x={(x-bodyW/2).toFixed(1)} y={top.toFixed(1)} width={bodyW.toFixed(1)} height={bh.toFixed(1)} fill={col}/>
            </g>);
          })}
          {emaS.map(s=> <polyline key={s.p} points={linePts(s.vals)} fill="none" stroke={s.c} strokeWidth="1.4" strokeLinejoin="round" strokeLinecap="round" opacity="0.95"/>)}
          {/* เส้นราคาล่าสุด + ป้ายไฮไลต์บนแกน */}
          <line x1={padL} x2={w-padR} y1={yLast.toFixed(1)} y2={yLast.toFixed(1)} stroke={lastCol} strokeWidth="0.9" strokeDasharray="3 3" opacity="0.85"/>
          <rect x={(w-padR).toFixed(1)} y={(yLast-7.5).toFixed(1)} width={padR} height="15" rx="2.5" fill={lastCol}/>
          <text x={(w-padR/2).toFixed(1)} y={(yLast+3.5).toFixed(1)} fontSize="11" fontFamily="monospace" fontWeight="700" fill="#fff" textAnchor="middle">{axLab(last.c)}</text>
        </svg>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8,fontSize:11.5}}>
          <span style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}>🕯️ แท่งเทียน {N} วัน · <span className="mono" style={{color:last.c>=last.o?UP:DOWN}}>{fmt(last.c)}</span></span>
          {emaS.map(s=>(
            <span key={s.p} style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}>
              <span style={{width:14,height:3,borderRadius:2,background:s.c,display:"inline-block"}}></span>
              {s.label} <span className="mono" style={{color:s.c}}>{s.vals[s.vals.length-1]!=null?fmt(s.vals[s.vals.length-1]):"—"}</span>
            </span>
          ))}
        </div>
      </div>
    );
  }

  // ---- fallback: เส้นราคา (กรณีไม่มี ohlc) ----
  const N=Math.min(closes.length,160);
  const start=closes.length-N;
  const px=closes.slice(start);
  const ser=series.map(d=>({...d, vals: emaFull(closes,d.p).slice(start)}));
  let all=[...px]; ser.forEach(s=>s.vals.forEach(v=>{ if(v!=null) all.push(v); }));
  const min=Math.min(...all), max=Math.max(...all), rng=(max-min)||1;
  const X=i=> padX + (i/(N-1))*(w-padX*2);
  const linePts=arr=> arr.map((v,i)=> v==null?null:(X(i).toFixed(1)+","+Y(v,min,rng).toFixed(1))).filter(Boolean).join(" ");
  const up = px[px.length-1] >= px[0]; const priceCol = up?"#4ade80":"#f87171";
  const areaPts = "" + X(0).toFixed(1)+","+(h-padB) + " " + linePts(px) + " " + X(N-1).toFixed(1)+","+(h-padB);
  return (
    <div>
      <svg width="100%" viewBox={"0 0 "+w+" "+h} style={{display:"block",background:"var(--chartbg)",borderRadius:10,border:"1px solid var(--line)"}}>
        <polygon points={areaPts} fill={priceCol} opacity="0.07"/>
        <polyline points={linePts(px)} fill="none" stroke={priceCol} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
        {ser.map(s=> <polyline key={s.p} points={linePts(s.vals)} fill="none" stroke={s.c} strokeWidth="1.4" strokeLinejoin="round" strokeLinecap="round" opacity="0.95"/>)}
      </svg>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8,fontSize:11.5}}>
        <span style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}><span style={{width:14,height:3,borderRadius:2,background:priceCol,display:"inline-block"}}></span>ราคา</span>
        {ser.map(s=>(
          <span key={s.p} style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}>
            <span style={{width:14,height:3,borderRadius:2,background:s.c,display:"inline-block"}}></span>
            {s.label} <span className="mono" style={{color:s.c}}>{s.vals[s.vals.length-1]!=null?fmt(s.vals[s.vals.length-1]):"—"}</span>
          </span>
        ))}
      </div>
    </div>
  );
}

/* ---------- positions ---------- */
// ช่องตัวเลขแก้ได้ — โชว์เลขปัด (maxdec) ตอนไม่โฟกัส, เต็มความละเอียดตอนแก้ (ไม่ทำลายค่าจริง เช่น 4.1272001 หุ้น)
function NumCell({value,onCommit,width=96,maxdec=4}){
  const [foc,setFoc]=useState(false);
  const [raw,setRaw]=useState("");
  const disp = foc ? raw : (value!=null&&value!==""? Number(value).toLocaleString("en-US",{useGrouping:false,maximumFractionDigits:maxdec}) : "");
  return <input className="inp mono" type="number" style={{padding:"4px 6px",fontSize:13,height:30,width,textAlign:"right"}} value={disp}
    onFocus={()=>{ setRaw(value!=null?String(value):""); setFoc(true); }}
    onChange={e=>{ setRaw(e.target.value); onCommit(+e.target.value); }}
    onBlur={()=>setFoc(false)}/>;
}
function Positions({positions,setPositions,updatePos,data,watch,posWatch,fx}){
  const [add,setAdd]=useState(false);
  const [pick,setPick]=useState(false);
  const [f,setF]=useState({symbol:"",qty:0,cost:0});
  const cell={padding:"4px 6px",fontSize:13,height:30};
  // แปลงเป็น USD: native / (จำนวนสกุลนั้นต่อ 1 USD) — รวมพอร์ตหลายตลาดให้ถูก
  const curOf=s=>(data[s]&&data[s].currency)||"USD";
  const rateOf=s=>{ const c=curOf(s); return c==="USD"?1:((fx&&fx[c])||1); };
  const totalVal=positions.reduce((s,p)=>{ const px=data[p.symbol]&&data[p.symbol].price; return s+(px?px*p.qty/rateOf(p.symbol):0); },0);
  // invalidation status จาก /api/positions-watch (เชื่อม thesis → เตือนใกล้/หลุดจุดที่ LLM ตั้ง)
  const invMap={};
  ((posWatch&&posWatch.positions)||[]).forEach(x=>{ if(x&&x.symbol) invMap[String(x.symbol).toUpperCase()]={status:x.status,alert:x.alert,inv:x.invalidationPrice}; });
  const [sortBy,setSortBy]=useState("default");
  const totalCost=positions.reduce((s,p)=>s+((p.cost*p.qty/rateOf(p.symbol))||0),0);
  const totalPL=totalVal-totalCost;
  const metric=(p)=>{ const px=(data[p.symbol]&&data[p.symbol].price)||0; return {val:px*p.qty/rateOf(p.symbol),plPct:(px&&p.cost)?((px-p.cost)/p.cost*100):0,sig:(data[p.symbol]&&data[p.symbol].sig&&data[p.symbol].sig.label)||"—"}; };
  const sorted=[...positions].sort((a,b)=>{ const ma=metric(a),mb=metric(b); if(sortBy==="val")return mb.val-ma.val; if(sortBy==="pl")return mb.plPct-ma.plPct; if(sortBy==="plLow")return ma.plPct-mb.plPct; if(sortBy==="sig"){const o={BUY:0,HOLD:1,SELL:2}; return ((o[ma.sig]!=null?o[ma.sig]:3)-(o[mb.sig]!=null?o[mb.sig]:3));} return 0; });
  const [sellP,setSellP]=useState(null);     // position ที่กำลังจะขาย (เปิด modal)
  const [sellPrice,setSellPrice]=useState("");
  function save(){ if(!f.symbol||!f.qty) return; setPositions([...positions,{...f,id:Date.now(),symbol:f.symbol.toUpperCase()}]); setF({symbol:"",qty:0,cost:0}); setAdd(false); }
  function del(id){ if(confirm("ลบโพสิชั่นนี้ (ไม่บันทึกเป็นการเทรด)?")) setPositions(positions.filter(p=>p.id!==id)); }
  function openSell(p){ const px=(data[p.symbol]&&data[p.symbol].price); setSellP(p); setSellPrice(px!=null?(+px).toFixed(2):""); }
  async function doSell(){
    if(!sellP||!sellPrice) return;
    const w=(Array.isArray(watch)?watch:[]).find(x=>String(x.symbol||"").toUpperCase()===String(sellP.symbol||"").toUpperCase());
    const sl=w?(+w.sl||0):0;
    let r=null;
    try{ r=await fetch("/api/trades",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:sellP.symbol,qty:sellP.qty,buyPrice:sellP.cost,sellPrice:+sellPrice,sl})}).then(x=>x.json()); }catch(e){}
    if(r&&r.ok){ setPositions(positions.filter(p=>p.id!==sellP.id)); alert("✅ บันทึกขาย "+sellP.symbol+"\nกำไร/ขาดทุน "+(r.pnl>=0?"+":"")+"$"+r.pnl.toLocaleString()+" ("+(r.pnlPct>=0?"+":"")+r.pnlPct+"%)"+(r.rMultiple!=null?" · "+r.rMultiple+"R":"")); }
    else alert("บันทึกไม่สำเร็จ: "+((r&&r.error)||"เชื่อมต่อไม่ได้"));
    setSellP(null); setSellPrice("");
  }
  function pickFromWatch(sym){
    const d=data[sym]||{};
    const px=d.price!=null?+(+d.price).toFixed(2):0;
    setF({symbol:sym,qty:1,cost:px});  // prefill ราคาตลาด — ผู้ใช้แก้ qty/cost จริงได้
    setPick(false); setAdd(true);
  }
  const watchList=Array.isArray(watch)?watch:[];
  return (
    <div className="section">
      <div className="sh"><h3>💼 พอร์ตที่ถืออยู่</h3>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {positions.length>0 && <select className="inp sel" style={{width:"auto",fontSize:12.5}} value={sortBy} onChange={e=>setSortBy(e.target.value)} title="เรียงพอร์ต">
            <option value="default">เรียง: ตามที่เพิ่ม</option>
            <option value="val">มูลค่า มาก→น้อย</option>
            <option value="pl">กำไร% มาก→น้อย</option>
            <option value="plLow">ขาดทุน% ก่อน</option>
            <option value="sig">สัญญาณ (ซื้อก่อน)</option>
          </select>}
          <a className="btn sm ghost" href="/trades" target="_blank" rel="noopener noreferrer" title="ประวัติการเทรด + สถิติ (win rate, R-multiple)">📒 ประวัติเทรด</a>
          {watchList.length>0 && <button className="btn sm ghost" onClick={()=>setPick(true)} title="เลือกหุ้นจาก Watchlist มาเพิ่มเข้าพอร์ต">📋 จาก Watchlist</button>}
          <button className="btn sm" onClick={()=>{setF({symbol:"",qty:0,cost:0});setAdd(true);}}>+ เพิ่มโพสิชั่น</button>
        </div>
      </div>
      {positions.length===0 ? <div className="empty">ยังไม่มีหุ้นที่ถือ — กด "เพิ่มโพสิชั่น" เพื่อบันทึกที่ซื้อไว้</div> :
        <div style={{overflowX:"auto"}}><table>
          <thead><tr><th>หุ้น</th><th className="num">จำนวน</th><th className="num">ต้นทุน</th><th className="num">ราคาnow</th><th>สัญญาณ</th><th className="num">มูลค่า</th><th className="num hide-sm">%พอร์ต</th><th className="num hide-sm">เป้า%</th><th className="num">กำไร/ขาดทุน</th><th></th></tr></thead>
          <tbody>
            {sorted.map(p=>{
              const px=(data[p.symbol]&&data[p.symbol].price)||null;
              const rt=rateOf(p.symbol);
              const val=px?px*p.qty/rt:null, pl=px?(px-p.cost)*p.qty/rt:null, plPct=px?((px-p.cost)/p.cost*100):null;
              const ivs=invMap[String(p.symbol).toUpperCase()];
              return (
                <tr key={p.id} className={ivs&&ivs.status==="breached"?"pos-breach":(ivs&&ivs.status==="near"?"pos-near":"")}>
                  <td><input className="inp mono" style={{...cell,width:84,textTransform:"uppercase"}} value={p.symbol}
                       onChange={e=>updatePos(p.id,{symbol:e.target.value.toUpperCase()})} title="แก้ชื่อหุ้นได้ตรงนี้"/>
                       {curOf(p.symbol)!=="USD"&&<span style={{fontSize:9.5,fontWeight:700,color:"var(--dim)",marginLeft:5,whiteSpace:"nowrap"}} title={"ราคาเป็น "+curOf(p.symbol)+" · แปลงเป็น USD ในมูลค่า/กำไร"}>{curOf(p.symbol)}→$</span>}</td>
                  <td className="num"><NumCell value={p.qty} width={96} onCommit={v=>updatePos(p.id,{qty:v})}/></td>
                  <td className="num"><input className="inp mono" type="number" style={{...cell,width:96,textAlign:"right"}} value={p.cost||""}
                       onChange={e=>updatePos(p.id,{cost:+e.target.value})}/></td>
                  <td className="num mono">{px!=null?fmt(px):"—"}</td>
                  <td>{(()=>{ const dd=data[p.symbol]||{}; const sg=dd.sig||{label:"—",cls:"na"}; const iv=invMap[String(p.symbol).toUpperCase()];
                    return (<div style={{display:"flex",flexDirection:"column",gap:3,alignItems:"flex-start"}}>
                      <span><span className={"pill "+sg.cls}>{sg.label}</span>{dd.conviction!=null&&<span className="cc-conv" style={{marginLeft:5}}>conv {dd.conviction}</span>}</span>
                      {iv&&iv.status==="breached"&&<span className="pos-inv breach">🛑 หลุด ${fmt(iv.inv)}</span>}
                      {iv&&iv.status==="near"&&<span className="pos-inv near">⚠️ ใกล้ ${fmt(iv.inv)}</span>}
                    </div>); })()}</td>
                  <td className="num mono">{val!=null?"$"+fmt(val,0):"—"}</td>
                  <td className="num hide-sm">{val!=null&&totalVal>0?
                    <div style={{display:"flex",alignItems:"center",gap:7,justifyContent:"flex-end"}}>
                      <div className="alloc"><span style={{width:Math.min(100,val/totalVal*100)+"%"}}></span></div>
                      <span className="mono" style={{fontSize:12,color:"var(--muted)"}}>{fmt(val/totalVal*100,0)}%</span>
                    </div> : <span style={{color:"var(--dim)"}}>—</span>}</td>
                  <td className="num hide-sm">{(()=>{ const act=(val!=null&&totalVal>0)?val/totalVal*100:null; const tgt=p.target||0; const diff=(act!=null&&tgt>0)?act-tgt:null;
                    return <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
                      <input className="inp mono" type="number" style={{...cell,width:56,textAlign:"right"}} value={p.target||""} placeholder="—" onChange={e=>updatePos(p.id,{target:+e.target.value})} title="เป้าหมาย %พอร์ต (allocation)"/>
                      {diff!=null&&<span className={"alloc-tgt "+(Math.abs(diff)<2?"":(diff>0?"alloc-over":"alloc-under"))}>{Math.abs(diff)<2?"✓ ตรงเป้า":(diff>0?"เกิน "+fmt(diff,0)+"%":"ต่ำ "+fmt(-diff,0)+"%")}</span>}
                    </div>; })()}</td>
                  <td className={"num mono "+(pl>=0?"up":"down")}>{pl!=null?(pl>=0?"▲ +":"▼ −")+"$"+fmt(Math.abs(pl),0)+" ("+(plPct>=0?"+":"")+fmt(plPct)+"%)":"—"}</td>
                  <td className="num"><div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                    <button className="btn sm" onClick={()=>openSell(p)} title="ขาย → บันทึกเป็นเทรด (คำนวณกำไร/R)">💰</button>
                    <button className="btn danger sm" onClick={()=>del(p.id)} title="ลบ (ไม่บันทึก)">✕</button>
                  </div></td>
                </tr>
              );
            })}
          </tbody>
          <tfoot><tr className="pos-tot">
            <td>รวม {positions.length} ตัว</td><td></td>
            <td className="num mono">{fmt(totalCost,0)}</td><td></td><td></td>
            <td className="num mono">${fmt(totalVal,0)}</td><td className="hide-sm"></td><td className="hide-sm"></td>
            <td className={"num mono "+(totalPL>=0?"up":"down")}>{totalPL>=0?"+":""}${fmt(totalPL,0)} ({totalCost>0?(totalPL>=0?"+":"")+fmt(totalPL/totalCost*100,1)+"%":"—"})</td><td></td>
          </tr></tfoot>
        </table></div>
      }
      {add && (
        <div className="overlay" onClick={()=>setAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
            <h3>เพิ่มโพสิชั่น</h3><div className="msub">บันทึกหุ้นที่ซื้อไว้เพื่อคำนวณกำไรสด</div>
            <div className="field"><label>สัญลักษณ์หุ้น</label><input className="inp" value={f.symbol} onChange={e=>setF({...f,symbol:e.target.value})} placeholder="AAPL"/></div>
            <div className="row3">
              <div className="field"><label>จำนวนหุ้น</label><input className="inp" type="number" value={f.qty||""} onChange={e=>setF({...f,qty:+e.target.value})}/></div>
              <div className="field" style={{gridColumn:"span 2"}}><label>ราคาทุน/หุ้น</label><input className="inp" type="number" value={f.cost||""} onChange={e=>setF({...f,cost:+e.target.value})}/></div>
            </div>
            <div className="modal-acts"><button className="btn ghost" onClick={()=>setAdd(false)}>ยกเลิก</button><button className="btn" onClick={save}>บันทึก</button></div>
          </div>
        </div>
      )}
      {sellP && (
        <div className="overlay" onClick={()=>setSellP(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
            <h3>💰 ขาย {sellP.symbol}</h3>
            <div className="msub">บันทึกเป็นการเทรด → คำนวณกำไร/ขาดทุน + R-multiple ลงประวัติ</div>
            <div className="row3" style={{marginTop:10}}>
              <div className="field"><label>จำนวน (ถือ {fmt(sellP.qty,2)})</label><input className="inp mono" type="number" value={sellP.qty} disabled/></div>
              <div className="field"><label>ทุน/หุ้น</label><input className="inp mono" type="number" value={sellP.cost} disabled/></div>
              <div className="field"><label>ราคาขาย/หุ้น</label><input className="inp mono" type="number" value={sellPrice} onChange={e=>setSellPrice(e.target.value)} autoFocus/></div>
            </div>
            {sellPrice>0 && sellP.cost>0 && (()=>{ const pnl=(+sellPrice-sellP.cost)*sellP.qty; const pct=(+sellPrice-sellP.cost)/sellP.cost*100; return (
              <div style={{marginTop:8,fontSize:14,fontWeight:700,color:pnl>=0?"var(--up,#16a34a)":"var(--down,#dc2626)"}}>กำไร/ขาดทุน: {pnl>=0?"+":""}${pnl.toLocaleString(undefined,{maximumFractionDigits:0})} ({pct>=0?"+":""}{pct.toFixed(1)}%)</div>); })()}
            <div className="modal-acts"><button className="btn ghost" onClick={()=>setSellP(null)}>ยกเลิก</button><button className="btn" onClick={doSell}>บันทึกการขาย</button></div>
          </div>
        </div>
      )}
      {pick && (
        <div className="overlay" onClick={()=>setPick(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
            <h3>📋 เลือกจาก Watchlist</h3>
            <div className="msub">แตะหุ้นเพื่อเพิ่มเข้าพอร์ต — ระบบจะเติม symbol + ราคาตลาดให้อัตโนมัติ (แก้ก่อนบันทึกได้)</div>
            <div style={{maxHeight:"55vh",overflowY:"auto",margin:"6px -4px 0",display:"flex",flexDirection:"column",gap:6}}>
              {watchList.map(w=>{
                const sym=String(w.symbol||"").toUpperCase();
                const d=data[sym]||{};
                const px=d.price;
                const chg=d.chgPct;
                const nm=d.name||"";
                const inPort=positions.some(p=>String(p.symbol||"").toUpperCase()===sym);
                const chgCol=(chg||0)>=0?"var(--up,#16a34a)":"var(--down,#dc2626)";
                return (
                  <button key={sym} className="btn ghost" onClick={()=>pickFromWatch(sym)}
                    style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",textAlign:"left",width:"100%"}}>
                    <span style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2}}>
                      <span style={{fontWeight:700}}>{sym}{inPort && <span style={{fontSize:10,marginLeft:6,padding:"1px 6px",borderRadius:8,background:"var(--panel2)",color:"var(--muted)"}}>ถืออยู่แล้ว</span>}</span>
                      {nm && <span style={{fontSize:11,color:"var(--muted)"}}>{nm}</span>}
                    </span>
                    <span style={{textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
                      <div className="mono" style={{fontWeight:600}}>{px!=null?"$"+fmt(px):"—"}</div>
                      {chg!=null && <div style={{fontSize:11,color:chgCol}}>{chg>=0?"+":""}{fmt(chg)}%</div>}
                    </span>
                  </button>
                );
              })}
              {watchList.length===0 && <div className="empty">ยังไม่มีหุ้นใน Watchlist</div>}
            </div>
            <div className="modal-acts"><button className="btn ghost" onClick={()=>setPick(false)}>ปิด</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- pro 3-tranche scale-in plan ---------- */
function ProPlan({ind}){
  const plan = ind ? suggestPro(ind) : null;
  if(!plan) return null;
  const box={background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:12,padding:"13px 15px",marginTop:16};
  const th={textAlign:"left",fontSize:11,color:"var(--dim)",fontWeight:600,padding:"3px 6px"};
  const td={padding:"6px 6px",fontSize:13};
  const rowSty={borderTop:"1px solid var(--line)"};
  return (
    <div style={box}>
      <div style={{fontSize:13.5,fontWeight:700}}>📐 แผนเข้า {plan.nTranches||plan.entries.length} ไม้ (Scale-in มืออาชีพ)</div>
      <div style={{fontSize:11.5,color:"var(--dim)",margin:"2px 0 9px"}}>ไม่เข้าหมดหน้าตักไม้เดียว — ทยอยซื้อตามแนวรับ ถัวต้นทุนให้ต่ำ คุมความเสี่ยง แล้วทยอยขายทำกำไรเป็นชั้น</div>
      {plan.caution&&<div style={{fontSize:12,color:"#f87171",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:9,padding:"7px 11px",margin:"0 0 9px",fontWeight:600,lineHeight:1.5}}>⚠️ {plan.caution}</div>}
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th style={th}>ไม้</th><th style={{...th,textAlign:"right"}}>ราคาเข้า</th>
          <th style={{...th,textAlign:"right"}}>สัดส่วน</th><th style={th}>อิงแนวรับ</th>
        </tr></thead>
        <tbody>
          {plan.entries.map((e,i)=>(
            <tr key={i} style={rowSty}>
              <td style={{...td,color:"#60a5fa",fontWeight:700}}>ไม้ {i+1}</td>
              <td style={{...td,textAlign:"right"}} className="mono">${fmt(e.price)}</td>
              <td style={{...td,textAlign:"right"}} className="mono">{(e.w*100).toFixed(0)}%</td>
              <td style={{...td,color:"var(--muted)",fontSize:11.5}}>{e.note}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{display:"flex",flexWrap:"wrap",gap:"5px 18px",marginTop:10,fontSize:12.5,alignItems:"center"}}>
        <span>ต้นทุนเฉลี่ย (ครบ 3 ไม้): <b className="mono" style={{color:"#fcd34d"}}>${fmt(plan.avg)}</b></span>
        <span>Stop Loss: <b className="mono" style={{color:"#f87171"}}>${fmt(plan.sl)}</b> <span style={{color:"var(--dim)"}}>(เสี่ยง ${fmt(plan.risk)}/หุ้น · -{fmt(plan.slPct)}%)</span></span>
      </div>
      <div style={{marginTop:9,fontSize:12.5}}>
        <div style={{color:"var(--dim)",marginBottom:4}}>เป้าทำกำไร — ทยอยขายออก (scale-out):</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"5px 16px"}}>
          {plan.tps.map((t,i)=>(
            <span key={i}>TP{i+1} <span style={{color:"var(--dim)"}}>{t.rr}</span> <b className="mono" style={{color:"#4ade80"}}>${fmt(t.price)}</b> <span style={{color:"var(--dim)"}}>ขาย {(t.w*100).toFixed(0)}%</span></span>
          ))}
        </div>
      </div>
      <div style={{fontSize:11,color:"var(--dim)",marginTop:9,lineHeight:1.5}}>
        💡 วิธีใช้: ตั้ง alert ที่ <b>ไม้ 1</b> เป็นจุดเริ่มทยอยเข้า · เลื่อน SL ขึ้นมาที่ต้นทุนเมื่อถึง TP1 (ปิดความเสี่ยง) · ขายบางส่วนทุกเป้าเพื่อล็อกกำไร
      </div>
    </div>
  );
}

/* ---------- detail modal ---------- */
function DetailModal({w,d,onClose,onSave,onAddPos,alertCfg,toggleEma,docked}){
  const ind=d&&d.ind, sig=(d&&d.sig)||{label:"—",cls:"na",reasons:[]};
  const emaShow=(alertCfg&&alertCfg.ema)||{};
  const [entry,setEntry]=useState(w.entry||"");
  const [sl,setSl]=useState(w.sl||"");
  const [tp,setTp]=useState(w.tp||"");
  const [note,setNote]=useState(w.note||"");
  function autoFill(){ const p=suggestPlan(ind); if(p){setEntry(p.entry);setSl(p.sl);setTp(p.tp);} }
  function save(){ onSave({entry:+entry||0,sl:+sl||0,tp:+tp||0,note}); onClose(); }
  const rr = (entry&&sl&&tp)&&(entry-sl)>0 ? ((tp-entry)/(entry-sl)).toFixed(2) : null;
  return (
    <div className={docked?"dock-wrap":"overlay"} onClick={docked?null:onClose}>
      <div className={docked?"dock":"modal"} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div><h3 className="head-font">{w.symbol} <span className={"pill "+sig.cls}>{sig.label}</span>{d&&d.conviction!=null&&<span className="cc-conv" style={{marginLeft:6}}>conv {d.conviction}</span>}</h3>
            <div className="msub">{d&&d.name?d.name:""} {d&&d.price!=null?" · $"+fmt(d.price):""} {d&&d.chgPct!=null?<span className={d.chgPct>=0?"up":"down"}> ({d.chgPct>=0?"+":""}{fmt(d.chgPct)}%)</span>:""}
              {d&&d.extra && <span className={d.extra.chg>=0?"up":"down"} style={{marginLeft:8}}>· {d.extra.type==="pre"?"ก่อนเปิด":"หลังปิด"} ${fmt(d.extra.price)} {d.extra.chg>=0?"▲":"▼"}{d.extra.chgPct!=null?fmt(Math.abs(d.extra.chgPct))+"%":""}</span>}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <a className="btn sm ghost" href={"https://finance.yahoo.com/quote/"+encodeURIComponent(w.symbol)} target="_blank" rel="noopener noreferrer" style={{whiteSpace:"nowrap"}} title={"เปิดกราฟ/ข่าวเต็มของ "+w.symbol+" ที่ Yahoo Finance"}>📈 กราฟเต็ม</a>
            <a className="btn sm ghost" href="/thesis" target="_blank" rel="noopener noreferrer" style={{whiteSpace:"nowrap"}} title={"ดูบทวิเคราะห์ LLM ทุกตัว (รวม "+w.symbol+")"}>🧠 Thesis AI</a>
            {docked && <button className="btn sm ghost" onClick={onClose} title="ปิดพาเนล" aria-label="ปิดพาเนล" style={{lineHeight:1}}>✕</button>}
          </div>
        </div>

        {/* ปุ่มสลับเส้น EMA บนกราฟ (= เส้นที่จะแจ้งเตือนด้วย) */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"10px 0 8px"}}>
          {EMA_DEFS.map(dd=>{ const on=!!(emaShow&&emaShow[dd.p]); return (
            <button key={dd.p} type="button" onClick={()=>toggleEma&&toggleEma(dd.p,!on)}
              style={{fontSize:11.5,padding:"3px 9px",borderRadius:20,cursor:"pointer",
                border:"1px solid "+(on?dd.c:"#2a3140"), background:on?dd.c+"22":"transparent",
                color:on?dd.c:"var(--dim)"}}>● {dd.label}</button>
          );})}
        </div>
        <div style={{margin:"2px 0 14px"}}><EmaChart closes={d&&d.closes} ohlc={d&&d.ohlc} show={emaShow} w={docked?430:560} h={230}/></div>

        <div className="ind-grid">
          <div className="ind"><div className="l">RSI (14)</div><div className="v mono">{ind&&ind.rsi!=null?ind.rsi.toFixed(1):"—"}</div></div>
          <div className="ind"><div className="l">MACD hist</div><div className="v mono">{ind&&ind.macd?ind.macd.hist.toFixed(2):"—"}</div></div>
          <div className="ind"><div className="l">EMA 15 / 30</div><div className="v mono">{ind&&ind.ema15!=null?fmt(ind.ema15):"—"} / {ind&&ind.ema30!=null?fmt(ind.ema30):"—"}</div></div>
          <div className="ind"><div className="l">EMA 50 / 100</div><div className="v mono">{ind&&ind.ema50!=null?fmt(ind.ema50):"—"} / {ind&&ind.ema100!=null?fmt(ind.ema100):"—"}</div></div>
          <div className="ind"><div className="l">EMA 200</div><div className="v mono">{ind&&ind.ema200!=null?fmt(ind.ema200):"—"}</div></div>
          <div className="ind"><div className="l">SMA 200</div><div className="v mono">{ind&&ind.sma200!=null?fmt(ind.sma200):"—"}</div></div>
          <div className="ind"><div className="l">Bollinger %B</div><div className="v mono">{ind&&ind.boll?(ind.boll.pctB*100).toFixed(0)+"%":"—"}</div></div>
          <div className="ind"><div className="l">ROC (10 ว.)</div><div className="v mono">{ind&&ind.roc!=null?(ind.roc>=0?"+":"")+ind.roc.toFixed(1)+"%":"—"}</div></div>
        </div>

        {sig.dims && <div style={{margin:"12px 0 6px"}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:7}}>conviction 5 มิติ <span style={{fontWeight:400,fontSize:11.5,color:"var(--dim)"}}>(regime-weighted — โมเดลจริงที่ออกป้าย)</span>
            {sig.wreason&&<div style={{fontWeight:400,fontSize:12,color:"var(--muted)",marginTop:3}}>→ {sig.wreason}</div>}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {[["เทรนด์","trend"],["โมเมนตัม","momentum"],["กลับตัว","meanRev"],["เงินไหล","moneyFlow"],["แรงเทียบตลาด","relStrength"]].map(([lab,k])=>{
              const v=sig.dims[k]; if(v==null) return null;
              const col=v>0.05?"#4ade80":v<-0.05?"#f87171":"#9aa3b2";
              return <span key={k} style={{fontSize:11.5,fontWeight:600,padding:"3px 9px",borderRadius:8,border:"1px solid "+col+"44",background:col+"14",color:col}}>{lab} {v>0.05?"▲":v<-0.05?"▼":"•"}</span>;
            })}
          </div>
        </div>}
        {sig.reasons&&sig.reasons.length>0 &&
          <div className="reason"><b>อินดิเคเตอร์ดิบ (อ้างอิง):</b><ul>{sig.reasons.map((r,i)=><li key={i}>{r}</li>)}</ul></div>}

        <ProPlan ind={ind}/>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"18px 0 8px"}}>
          <label style={{fontSize:13,color:"var(--muted)"}}>แผนเทรด (Entry / SL / TP) — สำหรับตั้ง alert</label>
          <button className="btn ghost sm" onClick={autoFill} title="ดึงค่าจากแผน 3 ไม้: Entry = ไม้ 1 (จุดเริ่มเข้า), SL ใต้ไม้ 3, TP ที่ RR 1:2">✨ ดึงจากแผน 3 ไม้</button>
        </div>
        <div className="row3">
          <div className="field"><label>Entry</label><input className="inp mono" type="number" value={entry} onChange={e=>setEntry(e.target.value)}/></div>
          <div className="field"><label>Stop Loss</label><input className="inp mono" type="number" value={sl} onChange={e=>setSl(e.target.value)}/></div>
          <div className="field"><label>Take Profit</label><input className="inp mono" type="number" value={tp} onChange={e=>setTp(e.target.value)}/></div>
        </div>
        {rr && <div style={{fontSize:12.5,color:"var(--muted)",marginTop:-4}}>Risk/Reward = <b style={{color: rr>=2?"#4ade80":"#fcd34d"}}>1:{rr}</b></div>}
        <div className="field" style={{marginTop:12}}><label>โน้ต</label><input className="inp" value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น รอเบรค 195 / ดูงบ Q2"/></div>

        <div className="modal-acts">
          <button className="btn ghost" onClick={()=>{ if(d&&d.price){onAddPos({id:Date.now(),symbol:w.symbol,qty:1,cost:d.price}); alert("เพิ่มเข้าพอร์ต 1 หุ้น @ "+fmt(d.price)+" (แก้จำนวนได้ในตารางพอร์ต)");} }}>+ เข้าพอร์ต</button>
          <button className="btn ghost" onClick={onClose}>ปิด</button>
          <button className="btn" onClick={save}>บันทึกแผน</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- settings ---------- */
function SettingsModal({webhook,setWebhook,autoSec,setAutoSec,onClose,onTest,riskConfig,onSaveRisk}){
  const [url,setUrl]=useState(webhook);
  const [sec,setSec]=useState(autoSec);
  const [cap,setCap]=useState((riskConfig&&riskConfig.capital)||"");
  const [rpt,setRpt]=useState((riskConfig&&riskConfig.riskPctPerTrade)||1);
  const [rfp,setRfp]=useState((riskConfig&&riskConfig.riskFreePct)||4.5);
  function save(){ setWebhook(url.trim()); setAutoSec(+sec||0); if(onSaveRisk) onSaveRisk({capital:+cap||0,riskPctPerTrade:+rpt||1,riskFreePct:+rfp||4.5}); onClose(); setTimeout(onTest,150); }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>⚙ ตั้งค่า</h3><div className="msub">Watchlist ซิงค์ข้ามเครื่องอัตโนมัติ (เก็บบน server) · ตั้งค่าด้านล่างเฉพาะของเครื่องนี้</div>
        <div className="field">
          <label>แหล่งราคาหุ้น (advanced)</label>
          <input className="inp mono" value={url} onChange={e=>setUrl(e.target.value)} placeholder="/api/stocks"/>
          <div style={{fontSize:12,color:"var(--dim)",marginTop:6}}>ค่า default <code>/api/stocks</code> = ดึงจาก CF Worker ตัวเอง ไม่ต้องตั้งอะไร · ใส่ <code>https://xxxx.app.n8n.cloud/webhook/stocks</code> ได้ถ้าอยากใช้ n8n เองแทน</div>
        </div>
        <div className="field">
          <label>รีเฟรชอัตโนมัติทุกกี่วินาที (0 = ปิด)</label>
          <select className="inp" value={sec} onChange={e=>setSec(+e.target.value)}>
            <option value={0}>ปิด (กดรีเฟรชเอง)</option>
            <option value={30}>30 วินาที</option>
            <option value={60}>1 นาที</option>
            <option value={120}>2 นาที</option>
            <option value={300}>5 นาที</option>
          </select>
        </div>
        <div style={{borderTop:"1px solid var(--line)",margin:"6px 0 12px",paddingTop:12}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>💰 เงินทุน & ความเสี่ยง <span style={{fontWeight:400,fontSize:11.5,color:"var(--dim)"}}>(ใช้คำนวณ Portfolio Heat + ขนาดไม้)</span></div>
          <div className="field">
            <label>เงินพอร์ตรวม (USD)</label>
            <input className="inp mono" type="number" value={cap} onChange={e=>setCap(e.target.value)} placeholder="เช่น 8993"/>
            <div style={{fontSize:11.5,color:"var(--dim)",marginTop:5}}>ใส่เงินจริงเพื่อให้ขนาดไม้/Heat แม่นยำ (เดิมตั้งทดสอบไว้ $100k)</div>
          </div>
          <div className="field">
            <label>% เสี่ยงต่อไม้</label>
            <select className="inp" value={rpt} onChange={e=>setRpt(+e.target.value)}>
              <option value={0.5}>0.5% — อนุรักษ์ (เปิดได้ ~12 ไม้)</option>
              <option value={1}>1% — มาตรฐาน (เปิดได้ ~6 ไม้)</option>
              <option value={1.5}>1.5% — กลาง</option>
              <option value={2}>2% — รุก (เปิดได้ ~3 ไม้)</option>
            </select>
            <div style={{fontSize:11.5,color:"var(--dim)",marginTop:5}}>ยอมขาดทุนกี่% ของพอร์ตต่อ trade ถ้าโดน stop loss</div>
          </div>
          <div className="field">
            <label>ผลตอบแทนเงินสด/ปี (risk-free %)</label>
            <input className="inp mono" type="number" step="0.1" value={rfp} onChange={e=>setRfp(e.target.value)} placeholder="4.5"/>
            <div style={{fontSize:11.5,color:"var(--dim)",marginTop:5}}>ดอกเบี้ยที่เงินสดได้ถ้าไม่ลงทุน (T-bill ~4.5%) — ใช้เป็น hurdle เตือนค่าเสียโอกาส</div>
          </div>
        </div>
        <div className="modal-acts">
          <button className="btn ghost" onClick={onClose}>ยกเลิก</button>
          <button className="btn" onClick={save}>บันทึก + ทดสอบ</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
