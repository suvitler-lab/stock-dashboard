<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Dashboard · Aria</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>📈</text></svg>">
<script>try{var _t=JSON.parse(localStorage.getItem('stk.theme'));if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#0a0c12; --bg-1:#0e1119;
    --panel:#13161f; --panel2:#191d28; --line:#262b38; --line2:#2f3546;
    --txt:#e7eaf0; --muted:#9aa3b2; --dim:#646b7a;
    --brand:#3b82f6; --brand2:#60a5fa; --violet:#8b5cf6;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --up:#4ade80; --down:#f87171;
    --chartbg:#0d1017; --track:#3a4150;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px -20px rgba(0,0,0,.8);
    --shadow-lg:0 28px 70px -34px rgba(0,0,0,.85);
    --glass:rgba(15,18,26,.72);
    --radius:16px;
  }
  html[data-theme="light"]{
    --bg:#eaeef6; --bg-1:#f3f6fb;
    --panel:#ffffff; --panel2:#f2f5fa; --line:#e3e8f1; --line2:#d5dce8;
    --txt:#1b2233; --muted:#5a6678; --dim:#9aa4b5;
    --up:#15a34a; --down:#dc2626;
    --chartbg:#f7f9fc; --track:#cbd3e0;
    --shadow:0 1px 2px rgba(30,41,73,.05),0 14px 30px -22px rgba(30,41,73,.32);
    --shadow-lg:0 28px 64px -34px rgba(30,41,73,.4);
    --glass:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(1200px 600px at 82% -12%,var(--bg-1),transparent 60%),
               radial-gradient(900px 520px at -5% 0%,rgba(59,130,246,.06),transparent 55%),var(--bg);
    transition:background .3s,color .3s}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  .head-font{font-family:'Prompt','Sarabun',sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  a{color:var(--brand2)}
  ::selection{background:rgba(59,130,246,.3)}

  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 80px}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    margin:0 -28px 24px;padding:16px 28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--violet));display:grid;place-items:center;font-size:23px;box-shadow:0 8px 22px -8px rgba(59,130,246,.6)}
  .brand h1{font-size:19px;letter-spacing:.2px}
  .brand p{font-size:11.5px;color:var(--muted);letter-spacing:1px}
  .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .status{font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18),0 0 8px var(--green)}
  .dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
  .dot.idle{background:var(--dim)}

  .btn{background:var(--brand);color:#fff;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 6px 16px -10px rgba(59,130,246,.9)}
  .btn:hover{background:var(--brand2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--brand);background:var(--panel)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.danger{background:#2a1416;color:#fca5a5;border:1px solid #3a1d22;box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  html[data-theme="light"] .btn.danger{background:#fde8e8;color:#dc2626;border-color:#f7caca}
  html[data-theme="light"] .btn.ghost{box-shadow:var(--shadow)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:15px;margin-bottom:24px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--violet));opacity:.85}
  .kpi .lab{font-size:12.5px;color:var(--muted)}
  .kpi .val{font-size:27px;font-weight:700;margin-top:9px;line-height:1}
  .kpi .meta{font-size:12px;margin-top:7px;color:var(--dim)}

  .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
  .section .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .section h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer;transition:background .12s}
  tbody tr.click:hover{background:var(--panel2)}
  .num{text-align:right}
  .up{color:var(--up)} .down{color:var(--down)}
  .ah{font-size:10px;font-weight:600;margin-top:2px;opacity:.85;letter-spacing:.2px}

  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.4px;white-space:nowrap}
  .pill.buy{background:#0f2a1a;color:#4ade80} .pill.sell{background:#2a1416;color:#f87171}
  .pill.hold{background:#27211040;color:#fcd34d;border:1px solid #3a2f15} .pill.na{background:#23262f;color:var(--dim)}
  .pill.new{background:rgba(96,165,250,.13);color:#7cb5ff;border:1px solid rgba(96,165,250,.30)}
  html[data-theme="light"] .pill.buy{background:#dcfce7;color:#15803d}
  html[data-theme="light"] .pill.sell{background:#fee2e2;color:#b91c1c}
  html[data-theme="light"] .pill.hold{background:#fef9c3;color:#a16207;border-color:#fde68a}
  html[data-theme="light"] .pill.na{background:#eef1f6;color:#94a0b2}
  html[data-theme="light"] .pill.new{background:#dbeafe;color:#2563eb;border-color:#bfdbfe}
  .sym{font-weight:700;font-family:'Prompt'} .symx{font-size:11px;color:var(--dim)}
  .rsi-b{display:inline-block;min-width:34px;text-align:center;padding:2px 0;border-radius:6px;font-size:12.5px;font-weight:700}
  /* หุ้นใหม่ / ข้อมูลย้อนหลังไม่พอ — โชว์ให้รู้ว่า "ระบบไม่พัง แค่หุ้นยังใหม่" */
  .spark-na{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-weight:600;white-space:nowrap}
  .spark-na::before{content:"";display:inline-block;width:30px;border-top:1.6px dashed currentColor;opacity:.55}
  tr.row-new td{background:rgba(96,165,250,.045)}
  tr.row-new td:first-child{box-shadow:inset 3px 0 0 rgba(96,165,250,.5)}
  tr.row-new .sym{opacity:.92}

  /* ---------- Command Center ---------- */
  .cc{margin-bottom:24px}
  .cc-top{display:grid;grid-template-columns:1fr minmax(220px,.62fr);gap:14px;margin-bottom:14px}
  .cc-regime{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}
  .cc-rgoff{margin-top:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#f87171;font-weight:600;line-height:1.5}
  .cc-rg-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cc-rg-m{margin-top:9px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .cc-sep{color:var(--dim)} .cc-dim{color:var(--dim);font-size:12.5px;font-weight:400}
  .cc-heat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow)}
  .cc-heat.warn{border-color:#f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.07),transparent)}
  .cc-heat-h{font-size:12.5px;color:var(--muted);font-weight:600}
  .cc-heat-v{font-size:15px;margin-top:5px} .cc-heat-v b{font-size:19px}
  .cc-heat-w{font-size:12px;color:#f59e0b;margin-top:6px;line-height:1.45}
  .cc-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px}
  .cc-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .cc-box-h{font-size:13.5px;font-weight:700;margin-bottom:10px}
  .cc-item{padding:7px 0;border-bottom:1px solid var(--line)}
  .cc-item:last-child{border-bottom:none}
  .cc-it-t{display:flex;align-items:center;gap:7px;font-size:14px;flex-wrap:wrap}
  .cc-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .cc-conv{font-size:11px;color:var(--brand2);background:rgba(59,130,246,.12);padding:1px 7px;border-radius:6px;font-weight:600}
  .cc-tag{font-size:10.5px;color:#f59e0b;background:rgba(245,158,11,.12);padding:1px 7px;border-radius:6px;font-weight:700}
  .cc-empty{font-size:12.5px;color:var(--dim);padding:8px 0}
  .cc-links{display:flex;gap:10px;flex-wrap:wrap}
  .cc-link{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;transition:.15s}
  .cc-link:hover{border-color:var(--brand);background:var(--panel);transform:translateY(-1px)}
  @media(max-width:680px){.cc-top{grid-template-columns:1fr}}
  .pos-inv{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
  .pos-inv.breach{background:rgba(239,68,68,.14);color:#f87171}
  .pos-inv.near{background:rgba(245,158,11,.14);color:#f59e0b}
  tr.pos-breach td{background:rgba(239,68,68,.06)} tr.pos-breach td:first-child{box-shadow:inset 3px 0 0 #ef4444}
  tr.pos-near td{background:rgba(245,158,11,.05)} tr.pos-near td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
  tr.pos-tot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:700;font-size:13px;padding-top:12px}
  .cc-item.click{cursor:pointer;transition:background .12s} .cc-item.click:hover{background:var(--panel2)}
  .cc-upd{font-size:11.5px;color:var(--dim);align-self:center;animation:ccpulse 1.2s ease-in-out infinite}
  @keyframes ccpulse{0%,100%{opacity:.4}50%{opacity:1}}
  .alloc-tgt{font-size:10.5px;color:var(--dim)} .alloc-over{color:#f59e0b} .alloc-under{color:#60a5fa}
  /* Edge strip — ระบบนี้แม่นจริงไหม */
  .cc-edge{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .cc-edge-h{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cc-edge-h .cc-dim{font-weight:400}
  .cc-edge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
  .cc-edge-it{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .cc-edge-it .l{font-size:11px;color:var(--muted);line-height:1.4}
  .cc-edge-it .v{font-size:21px;font-weight:700;margin-top:5px;line-height:1}
  .cc-edge-it .s{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.4}
  .cc-edge-empty{font-size:12.5px;color:var(--dim);padding:4px 0;line-height:1.5}

  .wl-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
  .seg button{padding:6px 13px;font-size:12.5px;color:var(--muted);font-weight:600;transition:.12s}
  .seg button.on{background:var(--brand);color:#fff}
  .seg button:not(.on):hover{color:var(--txt);background:var(--panel)}
  /* การ์ด watchlist — เห็นข้อมูลครบบนจอแคบ ไม่โดน hide-sm ตัด */
  .wl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
  .wl-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:.14s}
  .wl-card.click{cursor:pointer}
  .wl-card.click:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .wl-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .wl-card-px{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wl-card-px .ah{margin-top:0}
  .wl-card-spark{margin:10px 0 9px;min-height:46px;display:flex;align-items:center}
  .wl-card-foot{display:flex;align-items:center;gap:9px;padding-top:9px;border-top:1px solid var(--line)}
  .wl-card.row-new{background:rgba(96,165,250,.06)}
  .wl-card.row-new:not(:hover){border-color:rgba(96,165,250,.3)}
  .sel{width:auto;padding:7px 11px;font-size:12.5px}
  .wl-count{font-size:12px;color:var(--dim);margin-left:auto}
  .alloc{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:46px}
  .alloc>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--violet))}

  .add-row{display:flex;gap:9px}
  .inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:14px;width:100%;transition:border-color .15s,background .15s}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

  .overlay{position:fixed;inset:0;background:rgba(4,6,11,.66);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .modal h3{font-size:19px;margin-bottom:3px}
  .modal .msub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  /* master-detail: พาเนลรายละเอียด docked ขวา (เฉพาะจอกว้าง ≥1080px) — ลิสต์ซ้ายยังคลิกได้ */
  .dock-wrap{display:contents}
  .dock{position:fixed;top:0;right:0;height:100vh;width:480px;z-index:90;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-14px 0 44px rgba(0,0,0,.42);overflow-y:auto;
    padding:22px;animation:dockin .2s ease}
  @keyframes dockin{from{transform:translateX(26px);opacity:.5}to{transform:none;opacity:1}}
  .wrap.dock-open{max-width:none;margin:0;padding-right:500px}
  tr.sel td{background:rgba(59,130,246,.1)} tr.sel td:first-child{box-shadow:inset 3px 0 0 #3b82f6}
  .wl-card.sel{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}

  .banner{background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(139,92,246,.08));border:1px solid #2c3550;border-radius:var(--radius);padding:22px;margin-bottom:22px}
  .banner h3{font-size:17px;margin-bottom:10px}
  .banner ol{margin:10px 0 0 18px;font-size:13.5px;line-height:1.9;color:var(--muted)}
  .banner code{background:var(--chartbg);border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-family:'JetBrains Mono';font-size:12.5px}
  .empty{text-align:center;padding:40px;color:var(--dim)}
  .ind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
  .ind{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .ind .l{font-size:11.5px;color:var(--muted)} .ind .v{font-size:18px;font-weight:700;margin-top:3px}
  .reason{font-size:13px;color:var(--muted);line-height:1.7;margin-top:4px}
  .reason li{margin-left:18px}
  @media(max-width:720px){
    .hide-sm{display:none}
    .wrap{padding:0 14px 70px}
    .topbar{margin:0 -14px 18px;padding:13px 14px}
    .brand .mark{width:40px;height:40px;font-size:21px}
    .brand h1{font-size:17px}
    .kpi .val{font-size:23px}
    .modal{padding:18px}
    .row3{grid-template-columns:1fr}
    .wl-count{margin-left:0}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js?v=5e6f3fe666"></script>
</body>
</html>
